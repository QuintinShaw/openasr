name: Family Regression

# Real-model regression net: for every public model family, pull the smallest
# checkpoint at its smallest quant from the public catalog (real user chain,
# signature-verified) and transcribe a committed fixture on the CPU backend,
# comparing against committed goldens (tooling/family-regression/goldens/).
#
# Runs nightly, on release tags (release gate), and on demand. Kept outside
# push/PR CI because it performs real network downloads and native inference.

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * *"
  push:
    tags: ["v*"]

concurrency:
  group: family-regression-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  build-cli-linux:
    name: Build CLI (ubuntu-latest)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/quintinshaw/openasr-ci-linux@sha256:702284855863f1c6330eec503ac4570ff2cc844a958ceb7d2e2af5837633dcdc
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Prepare pinned Linux build environment
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          openasr-ci-verify
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: family-regression-ubuntu-latest
      - name: Build openasr CLI
        # The binary is shared with the case jobs via an artifact, and
        # GitHub's x86 runner fleet mixes CPU generations, so host-tuned ggml
        # kernels can SIGILL on a different case runner (same rule as
        # release-binaries.yml).
        env:
          OPENASR_GGML_NATIVE: "0"
        run: cargo build --release -p openasr-cli
      - uses: actions/upload-artifact@v7
        with:
          name: openasr-cli-ubuntu-latest
          path: target/release/openasr
          retention-days: 3

  build-cli-macos:
    name: Build CLI (macos-15)
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: family-regression-macos-15
      - name: Build openasr CLI
        env:
          OPENASR_GGML_NATIVE: "0"
        run: cargo build --release -p openasr-cli
      - uses: actions/upload-artifact@v7
        with:
          name: openasr-cli-macos-15
          path: target/release/openasr
          retention-days: 3

  family:
    name: ${{ matrix.case.name }} (${{ matrix.os }})
    needs: [build-cli-linux, build-cli-macos]
    strategy:
      # A single family failure must stay readable and must not cancel the
      # rest of the net.
      fail-fast: false
      matrix:
        # macos pinned (not macos-latest, which migrates to macOS 26 from
        # 2026-06-15): the regression net's environment must not drift
        # under the alias.
        os: [ubuntu-latest, macos-15]
        # Family registry: one entry per public model family, smallest
        # checkpoint x smallest quant. ONBOARDING A NEW FAMILY IS NOT DONE
        # until it is registered here with a committed golden under
        # tooling/family-regression/goldens/<name>/ (generate it with
        # `tooling/family-regression/run.sh --case <name> --ref <ref>
        # --update-golden` on a local CPU run, then confirm both CI
        # platforms; add golden.<os>.txt variants when platforms disagree).
        #
        # mode=transcribe runs the real user chain (pull -> transcribe on the
        # CPU backend -> golden compare). mode=verify covers packs with no
        # batch transcribe path (pull -> ggml integrity probe only).
        # strategy: exact | normalized | wer:<threshold> (see compare.py).
        case:
          - { name: whisper, ref: "whisper-tiny:q4", mode: transcribe, strategy: exact }
          - { name: moonshine, ref: "moonshine-tiny:q8", mode: transcribe, strategy: exact }
          - { name: qwen, ref: "qwen3-asr-0.6b:q4", mode: transcribe, strategy: exact }
          - { name: sensevoice, ref: "sensevoice-small:q8", mode: transcribe, strategy: exact }
          - { name: dolphin, ref: "dolphin-cn-dialect-small:q4", mode: transcribe, strategy: exact }
          # Same dolphin family, base tier: covers the size-generalized runtime
          # (512 d_model import path) that the small checkpoint does not reach.
          - { name: dolphin-base-pack, ref: "dolphin-cn-dialect-base:q4", mode: transcribe, strategy: exact }
          - { name: xasr, ref: "xasr-zh-en:q8", mode: transcribe, strategy: exact }
          - { name: cohere, ref: "cohere-transcribe-03-2026:q8", mode: transcribe, strategy: exact }
          # Public MOSS q4 has the same JFK words as the measured fp16 CPU
          # baseline; this case exercises the released pull -> verify -> decode
          # chain. Speaker/timestamp structure remains covered by its dedicated
          # real-pack and weight-free contract tests.
          - { name: moss, ref: "moss-transcribe-diarize:q4", mode: transcribe, strategy: exact }
          # FireRedASR2-AED: catalog entry ships staged private (public:false
          # until the 0.1.9 batch, see models-core.toml), so this row starts
          # failing closed on the pull step until that flip -- matches
          # dolphin's own staged-then-flipped onboarding history.
          - { name: firered, ref: "firered-aed-l-v2:q4", mode: transcribe, strategy: exact }
          # Speaker separation is exercised end to end through --diarize on the
          # whisper-tiny pack; the golden asserts the transcript, not speaker
          # labels. Only the ReDimNet2-B6 embedder is pulled: it is the single
          # supported speaker-embedding pack (see requiredDiarizationModels /
          # registry.rs), and the retired WeSpeaker id this row used to pull no
          # longer exists in the catalog at all, so that pull failed closed.
          - { name: diarize, ref: "whisper-tiny:q4", mode: diarize, strategy: exact,
              args: "--extra-pull redimnet2-b6-cn:fp16" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: openasr-cli-${{ matrix.os }}
          path: bin
      - run: chmod +x bin/openasr
      - name: Restore model pack cache
        uses: actions/cache@v6
        with:
          path: ~/.openasr/models
          key: openasr-packs-${{ matrix.case.name }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('model-registry/catalog.json') }}
      - name: Run family regression case
        run: |
          tooling/family-regression/run.sh \
            --case "${{ matrix.case.name }}" \
            --ref "${{ matrix.case.ref }}" \
            --mode "${{ matrix.case.mode }}" \
            --strategy "${{ matrix.case.strategy }}" \
            --bin bin/openasr \
            ${{ matrix.case.args || '' }}
      - name: Upload transcript
        if: always() && matrix.case.mode != 'verify'
        uses: actions/upload-artifact@v7
        with:
          name: transcript-${{ matrix.case.name }}-${{ matrix.os }}
          path: tmp/family-regression/
          if-no-files-found: ignore
          retention-days: 14
