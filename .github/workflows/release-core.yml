name: Release core

# Version-bump-triggered release. When the workspace version in the root
# Cargo.toml changes on main, this creates the draft GitHub Release tagged
# `vX.Y.Z`, then delegates every distributable build to one release matrix. Editing
# Cargo.toml without changing the version (deps, metadata) is a safe no-op because
# the resolve job exits cleanly when a Release for `vX.Y.Z` already exists.
# `workflow_dispatch` lets the maintainer cut the very first release (no bump)
# or re-run a failed one.
#
# The `vX.Y.Z` tag itself is created locally by `scripts/bump-version.sh
# --notes "..."` (an *annotated* tag whose message is the release notes) and
# shipped to origin by `git push --follow-tags` alongside the version-bump
# commit -- see RELEASING.md. This workflow does not create the tag; it reads
# the tag's annotation for the release's Highlights section and fails loudly
# if the tag is missing (a maintainer who forgot `--follow-tags` should see
# that immediately, not get a release with an empty Highlights block).

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
  workflow_dispatch:

# tag annotation is read-only (git fetch); write scope is for creating the
# release and calling release-binaries.yml (contents: write).
permissions:
  contents: write

# Serialize releases; never cancel one mid-flight.
concurrency:
  group: release-core
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  resolve:
    name: Resolve version
    # Never let a fork attempt a release; only the canonical repo tags+publishes.
    if: github.repository_owner == 'QuintinShaw'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      should_build: ${{ steps.v.outputs.should_build }}
      should_finalize: ${{ steps.v.outputs.should_finalize }}
      highlights: ${{ steps.highlights.outputs.highlights }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: v
        name: Read workspace version and check whether it is already released
        run: |
          set -euo pipefail
          # Single source of truth: [workspace.package] version in the root
          # Cargo.toml (all crates inherit via version.workspace = true). The
          # anchored match hits the only column-0 version line in the file.
          version="$(grep -m1 -E '^version = "' Cargo.toml | sed -E 's/^version = "([^"]+)".*/\1/')"
          if [ -z "${version}" ]; then
            echo "could not read workspace version from Cargo.toml" >&2
            exit 1
          fi
          tag="v${version}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

          # The tag must already exist on origin -- scripts/bump-version.sh
          # --notes creates it locally and `git push --follow-tags` ships it
          # together with this Cargo.toml commit. If it's missing, fail
          # loudly instead of silently skipping (a push without the tag is a
          # maintainer mistake, not a legitimate "already released" no-op).
          if ! git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            {
              echo "::error::tag ${tag} not found on origin."
              echo "Did you run scripts/bump-version.sh ${version} --notes \"...\" and git push --follow-tags? See RELEASING.md."
            } >&2
            exit 1
          fi
          git fetch --force --no-tags origin \
            "refs/tags/${tag}:refs/tags/${tag}" \
            "+refs/heads/main:refs/remotes/origin/main"
          tag_commit="$(git rev-parse "${tag}^{}")"
          [[ "$tag_commit" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::tag ${tag} does not peel to one commit" >&2; exit 1;
          }
          [ "${GITHUB_REF}" = "refs/heads/main" ] || {
            echo "::error::core releases may run only from protected main" >&2; exit 1;
          }
          [ "$(git rev-parse refs/remotes/origin/main)" = "${GITHUB_SHA}" ] || {
            echo "::error::workflow source is not the current origin/main commit" >&2; exit 1;
          }

          if ! gh release view "${tag}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            [ "$tag_commit" = "${GITHUB_SHA}" ] || {
              echo "::error::new release tag ${tag} points to ${tag_commit}, not workflow commit ${GITHUB_SHA}" >&2
              exit 1
            }
            echo "release ${tag} does not exist yet -- will build and release"
            echo "should_build=true" >> "${GITHUB_OUTPUT}"
            echo "should_finalize=false" >> "${GITHUB_OUTPUT}"
          else
            is_draft="$(gh release view "${tag}" --repo "${{ github.repository }}" --json isDraft --jq .isDraft)"
            if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "$is_draft" = "true" ]; then
              git merge-base --is-ancestor "$tag_commit" "${GITHUB_SHA}" || {
                echo "::error::finalization commit does not descend from release tag ${tag}" >&2
                exit 1
              }
              echo "release ${tag} is a draft -- will validate and deploy its committed PublishedInert catalog"
              echo "should_build=false" >> "${GITHUB_OUTPUT}"
              echo "should_finalize=true" >> "${GITHUB_OUTPUT}"
            else
              echo "release ${tag} already exists -- nothing to do"
              echo "should_build=false" >> "${GITHUB_OUTPUT}"
              echo "should_finalize=false" >> "${GITHUB_OUTPUT}"
            fi
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - id: highlights
        name: Read the annotated tag's message as release Highlights
        if: steps.v.outputs.should_build == 'true'
        run: |
          set -euo pipefail
          tag="${{ steps.v.outputs.tag }}"
          git fetch --no-tags origin "refs/tags/${tag}:refs/tags/${tag}"
          # Strip the trailing PGP signature block (present if the tagger's
          # git config auto-signs tags) -- only the annotation text itself is
          # the Highlights content.
          body="$(git for-each-ref "refs/tags/${tag}" --format='%(contents)' \
            | sed '/-----BEGIN PGP SIGNATURE-----/,$d')"
          if [ -z "${body// /}" ]; then
            echo "::error::tag ${tag} has an empty annotation -- was it created with \`git tag -a\` (not \`git tag\`)? See RELEASING.md." >&2
            exit 1
          fi
          {
            echo "highlights<<RELEASE_HIGHLIGHTS_EOF"
            echo "$body"
            echo "RELEASE_HIGHLIGHTS_EOF"
          } >> "${GITHUB_OUTPUT}"

  release:
    name: Create draft release
    needs: resolve
    if: needs.resolve.outputs.should_build == 'true' && success()
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: Assemble release notes (Highlights / What's Changed / Install & Verify)
        env:
          HIGHLIGHTS: ${{ needs.resolve.outputs.highlights }}
        run: |
          set -euo pipefail
          tag="${{ needs.resolve.outputs.tag }}"

          {
            echo "## Highlights"
            echo
            printf '%s\n' "$HIGHLIGHTS"
          } > highlights.md

          # "What's Changed": GitHub's generated-notes body already includes
          # its own "## What's Changed" heading, PR bullet list, and a
          # trailing "Full Changelog" compare link -- reuse it verbatim
          # instead of reimplementing PR-diffing.
          gh api "repos/${{ github.repository }}/releases/generate-notes" \
            -f "tag_name=${tag}" -f "target_commitish=${{ github.sha }}" \
            --jq .body > whats-changed.md

          # Install & Verify starts empty. The `finalize-notes` job below
          # replaces it from the complete, attested matrix's real asset list.
          printf '' | scripts/render-install-verify.sh \
            "${{ needs.resolve.outputs.version }}" "${{ github.repository }}" "${tag}" \
            > install-verify.md

          cat highlights.md whats-changed.md install-verify.md > body.md

      - name: Create draft GitHub Release
        run: |
          set -euo pipefail
          tag="${{ needs.resolve.outputs.tag }}"
          # The tag already exists (scripts/bump-version.sh --notes created
          # it locally; `git push --follow-tags` shipped it), so `gh release
          # create` publishes against that existing tag rather than minting
          # a fresh one.
          gh release create "${tag}" \
            --draft \
            --title "${tag}" \
            --notes-file body.md

  binaries:
    name: Build full release matrix
    needs: [resolve, release]
    if: needs.resolve.outputs.should_build == 'true' && success()
    # Grants the ceiling for every job in the called workflow -- reusable
    # workflows cannot elevate beyond what the caller job grants here. Only
    # the called workflow's checksum aggregation job consumes OIDC and writes
    # one build-provenance statement for the complete release subject set.
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
      packages: read
    uses: ./.github/workflows/release-binaries.yml
    with:
      formal_release: true
      ref: ${{ needs.resolve.outputs.tag }}
    # Reusable workflows do NOT see the caller's repository secrets unless
    # they are passed explicitly; without this the called workflow's Windows
    # legs read empty AZURE_* secrets and fail closed at their "refuse to
    # ship an unsigned Windows release binary" gate.
    secrets: inherit

  prepublication-family:
    name: Pre-publication family correctness gate
    needs: [resolve]
    if: needs.resolve.outputs.should_finalize == 'true' && success()
    permissions:
      actions: read
      attestations: read
      contents: read
      packages: read
    uses: ./.github/workflows/family-regression.yml
    with:
      pre_publication: true
      release_tag: ${{ needs.resolve.outputs.tag }}
    secrets: inherit

  deploy-catalog:
    name: Deploy PublishedInert candidate catalog
    needs: [resolve, prepublication-family]
    if: needs.resolve.outputs.should_finalize == 'true' && success()
    permissions:
      actions: read
      attestations: read
      contents: read
    uses: ./.github/workflows/deploy-catalog.yml
    with:
      orchestrator_run_id: ${{ github.run_id }}
      release_tag: ${{ needs.resolve.outputs.tag }}
      activation_transition: published-inert
    secrets: inherit

  finalize-notes:
    name: Finalize Install & Verify with real assets
    needs: [resolve, prepublication-family, deploy-catalog]
    if: needs.resolve.outputs.should_finalize == 'true' && success()
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: Rebuild Install & Verify from the release's actual assets
        run: |
          set -euo pipefail
          tag="${{ needs.resolve.outputs.tag }}"
          version="${{ needs.resolve.outputs.version }}"

          gh release view "$tag" --json assets --jq '.assets[].name' > asset-names.txt
          scripts/render-install-verify.sh "$version" "${{ github.repository }}" "$tag" \
            < asset-names.txt > install-verify.md
          gh release view "$tag" --json body --jq .body > current-body.md

          python3 scripts/splice-install-verify.py current-body.md install-verify.md > new-body.md

          gh release edit "$tag" --notes-file new-body.md
