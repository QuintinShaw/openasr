name: qwen GPU parity gate

# Manual diagnostic only. A successful run must be uploaded as a bound receipt
# before it can close the qwen/provider cell in the common correctness matrix;
# workflow execution itself is not a release claim. The self-hosted Windows HIP
# runner is required because GitHub-hosted runners have no AMD GPU.

on:
  workflow_dispatch:
    inputs:
      candidate_cli_artifact:
        required: true
        type: string
      candidate_plugin_artifact:
        required: true
        type: string
      staging_catalog_artifact:
        required: true
        type: string
      correctness_matrix_artifact:
        required: true
        type: string
      expected_provider:
        required: true
        type: string
      expected_device:
        required: true
        type: string
      pack_artifact:
        required: true
        type: string
      correctness_receipt_artifact:
        required: true
        type: string

concurrency:
  group: qwen-gpu-parity-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  windows-hip-parity:
    name: qwen GPU vs CPU transcript parity (HIP)
    if: github.repository_owner == 'QuintinShaw'
    runs-on: [self-hosted, Windows, X64, HIP]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.candidate_cli_artifact }}
          path: staging/candidate
      - uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.candidate_plugin_artifact }}
          path: staging/plugin
      - uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.staging_catalog_artifact }}
          path: staging/catalog
      - uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.correctness_matrix_artifact }}
          path: staging/correctness
      - uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.pack_artifact }}
          path: staging/pack

      - uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.correctness_receipt_artifact }}
          path: staging/receipts

      - name: Verify HIP SDK toolchain
        shell: pwsh
        run: |
          $hipRoot = $env:HIP_PATH
          if (-not $hipRoot) { $hipRoot = $env:ROCM_PATH }
          if (-not $hipRoot) { $hipRoot = $env:ROCM_HOME }
          if (-not $hipRoot) {
            Write-Error "HIP_PATH, ROCM_PATH, or ROCM_HOME must point to the AMD HIP SDK."
            exit 1
          }
          Write-Host "HIP SDK: $hipRoot"

      - name: Verify immutable candidate CLI and matrix inputs
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $candidate = Get-ChildItem -Path staging/candidate -Filter *.exe -Recurse | Select-Object -First 1
          if (-not $candidate) { Write-Error "candidate CLI executable is missing"; exit 1 }
          gh attestation verify $candidate.FullName --repo $env:GITHUB_REPOSITORY --signer-workflow "$env:GITHUB_REPOSITORY/.github/workflows/release-binaries.yml"
          $catalog = Get-ChildItem -Path staging/catalog -Filter catalog.json -Recurse | Select-Object -First 1
          $plugin = Get-ChildItem -Path staging/plugin -File -Recurse | Select-Object -First 1
          $matrix = Get-ChildItem -Path staging/correctness -Filter gpu-correctness-matrix.v1.json -Recurse | Select-Object -First 1
          $pack = Get-ChildItem -Path staging/pack -Filter *.oasr -Recurse | Select-Object -First 1
          $receipt = Get-ChildItem -Path staging/receipts -Filter gpu-correctness-receipt-*.json -Recurse | Select-Object -First 1
          if (-not $catalog -or -not $matrix -or -not $pack -or -not $receipt -or -not $plugin) { Write-Error "candidate catalog, matrix, plugin, exact pack, or correctness receipt is missing"; exit 1 }
          Get-FileHash $candidate.FullName,$plugin.FullName,$catalog.FullName,$matrix.FullName,$pack.FullName,$receipt.FullName -Algorithm SHA256
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\openasr-qwen-home" | Out-Null
          Copy-Item $candidate.FullName target\release\openasr.exe -Force
          $env:OPENASR_HOME = "$env:RUNNER_TEMP\openasr-qwen-home"
          Copy-Item $catalog.FullName "$env:OPENASR_HOME\catalog.json" -Force
          Copy-Item $pack.FullName "$env:OPENASR_HOME\qwen.oasr" -Force
          "OPENASR_QWEN_PARITY_EXE=$((Resolve-Path target\release\openasr.exe).Path)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "OPENASR_QWEN_PARITY_PACK=$((Resolve-Path "$env:OPENASR_HOME\qwen.oasr").Path)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "OPENASR_HOME=$env:OPENASR_HOME" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Trace producer environment
        shell: pwsh
        run: |
          $traceDir = Join-Path $env:RUNNER_TEMP "qwen-traces"
          New-Item -ItemType Directory -Force -Path $traceDir | Out-Null
          "OPENASR_QWEN_PARITY_TRACE_DIR=$traceDir" | Out-File -FilePath $env:GITHUB_ENV -Append
          "OPENASR_QWEN_PARITY_EXPECTED_PROVIDER=${{ inputs.expected_provider }}" | Out-File -FilePath $env:GITHUB_ENV -Append
          "OPENASR_QWEN_PARITY_EXPECTED_DEVICE=${{ inputs.expected_device }}" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: qwen GPU vs CPU transcript parity
        shell: pwsh
        run: |
          if (-not $env:OPENASR_HIP_GPU_TARGETS) { $env:OPENASR_HIP_GPU_TARGETS = "gfx1200" }
          pwsh tooling/qwen-gpu-parity/run.ps1

      - name: Verify and upload runtime-produced traces
        shell: pwsh
        run: |
          $traces = @(Get-ChildItem -Path $env:OPENASR_QWEN_PARITY_TRACE_DIR -Filter *.jsonl)
          if ($traces.Count -lt 2 -or -not ($traces.Name -match "cold") -or -not ($traces.Name -match "reuse")) {
            Write-Error "runtime did not produce non-empty cold/reuse per-step traces"; exit 1
          }
          $receipts = @(Get-ChildItem -Path staging/receipts -Filter gpu-correctness-receipt-*.json -Recurse)
          if ($receipts.Count -eq 0) { Write-Error "immutable correctness receipt artifact is missing"; exit 1 }
          Get-FileHash $traces.FullName,$receipts.FullName -Algorithm SHA256
          "QWEN_TRACE_ARTIFACT_COUNT=$($traces.Count)" | Out-File -FilePath $env:GITHUB_ENV -Append
      - uses: actions/upload-artifact@v8
        with:
          name: qwen-gpu-parity-runtime-output-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/qwen-traces
            staging/receipts
