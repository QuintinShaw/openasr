name: Release binaries

# Formal release bytes have exactly one entrypoint: release-core.yml calls this
# workflow and sets the workflow_call-only `formal_release` capability. Manual
# dispatch is deliberately a one-target diagnostic build: it can upload an
# Actions artifact for inspection, but cannot aggregate, attest, or mutate any
# GitHub Release (draft or public).
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (tag) to build; empty = default branch"
        required: false
        default: ""
      only_target:
        description: "Required exact matrix.target key for this non-release diagnostic"
        required: true
        type: string
      cuda_gpu_targets:
        description: "Optional CUDA arch list for a diagnostic workflow_dispatch build (empty = release defaults)"
        required: false
        default: ""
  workflow_call:
    inputs:
      formal_release:
        description: "Capability set only by release-core.yml"
        required: true
        type: boolean
      ref:
        description: "Git ref (tag) to build"
        required: false
        type: string
        default: ""
      only_target:
        description: "Build only this matrix.target key (empty = all legs; for validating a single platform without the full matrix)"
        required: false
        type: string
        default: ""
      cuda_gpu_targets:
        description: "Optional CUDA arch list for a diagnostic workflow_dispatch build (empty = release defaults)"
        required: false
        type: string
        default: ""
  # Formal releases enter through release-core.yml's workflow_call. Keeping
  # a second push:tags entrypoint used to race the orchestrator and could run
  # the same expensive matrix twice for one annotated tag.

permissions:
  contents: read

# Serialize a full matrix by ref. Diagnostic only_target dispatches share the
# ref but must not queue behind (or replace) each other. Never cancel a
# release that is already building: a later retry must wait.
concurrency:
  group: release-binaries-${{ inputs.ref || github.ref_name || github.ref }}-${{ inputs.only_target || 'all' }}
  cancel-in-progress: false

jobs:
  select-matrix:
    name: Select release matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      include: ${{ steps.select.outputs.include }}
      mode: ${{ steps.select.outputs.mode }}
      selected_target: ${{ steps.select.outputs.selected_target }}
      source_digest: ${{ steps.source_identity.outputs.source_digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Bind aggregation and provenance to one source commit
        id: source_identity
        env:
          REQUESTED_REF: ${{ inputs.ref || github.ref }}
        run: |
          set -euo pipefail
          checkout_commit="$(git rev-parse HEAD^{commit})"
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "GITHUB_SHA is not a lowercase commit digest" >&2
            exit 1
          }
          [ "$checkout_commit" = "$GITHUB_SHA" ] || {
            echo "requested ref '$REQUESTED_REF' resolved to $checkout_commit but the attestation event source is $GITHUB_SHA" >&2
            echo "dispatch the workflow from the exact release tag/commit; provenance cannot describe a different checkout" >&2
            exit 1
          }
          case "$REQUESTED_REF" in
            refs/tags/*) release_tag="${REQUESTED_REF#refs/tags/}" ;;
            v[0-9]*.*) release_tag="$REQUESTED_REF" ;;
            *) release_tag="" ;;
          esac
          if [ -n "$release_tag" ]; then
            tag_commit="$(git rev-parse "${release_tag}^{commit}")"
            [ "$tag_commit" = "$checkout_commit" ] || {
              echo "release tag $release_tag does not resolve to the attested checkout" >&2
              exit 1
            }
          fi
          echo "source_digest=$checkout_commit" >> "$GITHUB_OUTPUT"
      - name: Select matrix include
        id: select
        env:
          ONLY_TARGET: ${{ inputs.only_target || '' }}
          FORMAL_RELEASE: ${{ inputs.formal_release || false }}
          RELEASE_REF: ${{ inputs.ref || '' }}
          CUDA_GPU_TARGETS: ${{ inputs.cuda_gpu_targets || '' }}
          CALLER_WORKFLOW: ${{ github.workflow }}
          CALLER_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$FORMAL_RELEASE" = "true" ]; then
            [ "$CALLER_WORKFLOW" = "Release core" ] && [ "$CALLER_REF" = "refs/heads/main" ] || {
              echo "formal release capability is restricted to Release core on protected main" >&2; exit 1;
            }
            [ -z "$ONLY_TARGET" ] || {
              echo "formal release cannot select a partial matrix" >&2; exit 1;
            }
            [ -z "$CUDA_GPU_TARGETS" ] || {
              echo "formal release cannot override target-scoped CUDA rows" >&2; exit 1;
            }
            [[ "$RELEASE_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
              echo "formal release ref must be one exact vX.Y.Z tag" >&2; exit 1;
            }
          else
            [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ -n "$ONLY_TARGET" ] || {
              echo "manual release-binaries runs require one diagnostic only_target" >&2; exit 1;
            }
          fi
          include="$(python3 tooling/release-manifest/select_release_matrix.py --only-target "${ONLY_TARGET}")"
          {
            echo "include<<INCLUDE_EOF"
            echo "${include}"
            echo "INCLUDE_EOF"
            if [ -n "${ONLY_TARGET}" ]; then
              echo "mode=single"
            else
              echo "mode=full"
            fi
            echo "selected_target=${ONLY_TARGET}"
          } >> "${GITHUB_OUTPUT}"

  build:
    name: Build ${{ matrix.target }}
    needs: [select-matrix]
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout || 60 }}
    # Container images (CUDA/ROCm wrappers, official devel) default to sh.
    # Windows steps that need PowerShell set shell: pwsh explicitly.
    defaults:
      run:
        shell: bash
    # Escape hatch for future legs whose toolchain story is still settling:
    # mark them `experimental: true` and they may fail without failing the
    # run (their archives simply drop out of the required artifact set) until
    # they prove green. A successful experimental artifact is still checksummed
    # and attested, but it does not silently enter the activation catalog.
    continue-on-error: ${{ matrix.experimental || false }}
    # Build legs only package and upload immutable workflow artifacts. Release
    # provenance is generated once, after the complete matrix is collected, so
    # a transparency-log outage can retry without rebuilding every GPU target.
    permissions:
      contents: read
      packages: read
    # Linux CPU / CUDA / ROCm pins live in
    # .github/ci/linux-build-env.lock, linux-cuda.lock, linux-rocm.lock
    # and tooling/release-manifest/release_binaries_matrix.json.
    # Windows/macOS/arm64/musl/vulkan omit matrix.container and run on the host.
    # Credentials are sent only to GHCR; Docker Hub pulls stay anonymous.
    container: ${{ matrix.container && fromJSON(startsWith(matrix.container, 'ghcr.io/') && format('{{"image":{0},"credentials":{{"username":{1},"password":{2}}}}}', toJSON(matrix.container), toJSON(github.actor), toJSON(github.token)) || format('{{"image":{0}}}', toJSON(matrix.container))) || fromJSON('null') }}
    # Distributed binaries must be portable. build.rs auto-enables GGML_NATIVE
    # (-march=native) when host==target on x86, which is correct for local
    # build-and-run but would tune these released x86 binaries to the CI
    # runner's CPU and SIGILL on older end-user CPUs. Force it off here; power
    # users tune locally via --features native or OPENASR_GGML_NATIVE=1.
    env:
      OPENASR_GGML_NATIVE: "0"
      # The neutral host and every optional module must derive the same
      # generated ABI identity from an explicit release-toolchain contract.
      # Do not let a hosted-runner image rename silently create an ABI that
      # cannot be reproduced or compared by the signed backend catalog.
      OPENASR_BACKEND_TOOLCHAIN_CONTRACT: ${{ contains(matrix.target, 'windows-msvc') && 'msvc-v143' || 'platform-default' }}
      # Each release plugin is target-scoped. A manual diagnostic build may
      # still override a CUDA leg explicitly; tag/workflow_call releases use
      # the matrix target rather than emitting one opaque fatbin.
      OPENASR_CUDA_GPU_TARGETS: ${{ matrix.cuda_gpu_target || inputs.cuda_gpu_targets || '' }}
      OPENASR_HIP_GPU_TARGETS: ${{ matrix.hip_gpu_target || '' }}
      # AMD HIP SDK "PRO Edition" silent-installer release train, matched to
      # llama.cpp's current Windows HIP release job.
      HIPSDK_INSTALLER_VERSION: 26.Q1
      # Windows Vulkan loader (vulkan-1.dll) redistributable, shipped in the
      # inert optional Vulkan provider pack -- see the "Stage Vulkan loader" step
      # below for why (#132: STATUS_DLL_NOT_FOUND on machines with no GPU
      # driver). This is a *runtime redistributable* pin, independent of
      # VULKAN_VERSION above (that one pins the *build-time* SDK used to
      # compile/link the open-core provider). The provider pack is the sole
      # owner of this loader; Desktop neither stages nor mutates it. Bump the
      # version and both hashes together, cross-checked against LunarG's own
      # published
      # hash at https://vulkan.lunarg.com/sdk/sha/<version>/windows/VulkanRT-X64-<version>-Components.zip.json.
      VULKAN_LOADER_VERSION: 1.4.350.0
      # sha256 of the downloaded vulkan-runtime-components.zip archive.
      VULKAN_LOADER_ARCHIVE_SHA256: 23ce69f32cef3e2799617e2b1776cd0c71030d23a91f8375821cc40d76b185b9
      # sha256 of x64/vulkan-1.dll extracted from that archive -- a second,
      # independent pin so a change in the archive's internal layout (wrong
      # file extracted) is caught even though the archive-level hash above
      # already matched.
      VULKAN_LOADER_DLL_SHA256: 0419974f00e82a3d619077ba414da265a774f8db9d45ad93bc1843f44b2c2c1f
      # The neutral host is CPU-only. Only the optional Vulkan provider leg
      # needs the build-time SDK and owns the pinned loader redistributable.
      NEEDS_WINDOWS_VULKAN_SDK: ${{ contains(matrix.features, 'vulkan') }}
      BUNDLES_WINDOWS_VULKAN_LOADER: ${{ matrix.distribution == 'plugin' && matrix.provider == 'vulkan' }}
      # Full releases keep the hard-coded CUDA/HIP vendor owners. A diagnostic
      # exact-target dispatch must still upload that target's plugin + vendor
      # zip, so the selected plugin temporarily owns vendor publishing.
      VENDOR_OWNER: ${{ matrix.distribution == 'plugin' && ((inputs.only_target != '' && matrix.target == inputs.only_target) || matrix.vendor_owner) }}
      # Where the built binary + build.rs-staged runtime DLLs land. A native
      # leg (no matrix.rust_target) builds into target/release; a cross leg
      # (--target <triple>) builds into target/<triple>/release. Every package/
      # smoke step reads $RELEASE_DIR so both shapes share one code path.
      RELEASE_DIR: ${{ matrix.rust_target && format('target/{0}/release', matrix.rust_target) || 'target/release' }}
    # Asset naming: `matrix.target` is the INTERNAL key (used for cache keys,
    # smoke/gating conditions, and the upload-artifact name); `matrix.asset` is
    # the FRIENDLY, user-facing filename segment that lands in the release as
    # openasr-<version>-<asset>.<ext>. The mapping normalizes the Rust target
    # triple to human terms: unknown-linux-gnu -> linux, apple-darwin -> macos,
    # pc-windows-msvc -> windows; aarch64 -> arm64 (x86_64 unchanged); the AMD
    # GPU leg is `-rocm` on every OS (Windows' internal feature is `hip`, but
    # the asset name stays `-rocm` for cross-platform consistency -- this only
    # renames the asset, never the build feature flag); gnu libc is the
    # unsuffixed default, musl would carry `-musl`.
    #
    # Windows releases use one neutral GGML_BACKEND_DL host. It bundles the
    # CPU rescue modules only. Vulkan/CUDA/HIP are separately signed,
    # published-inert provider packs with content-addressed runtimes.
    # Legacy whole-engine Vulkan/CUDA/HIP sidecars ended with core 0.1.33.
    #
    # NOTE: jobs.verify-completeness below hardcodes this same asset/ext list
    # (TARGETS, now friendly asset names) to assert the release ends up with
    # every archive. Keep both in sync when adding/removing a leg. The
    # xcframework job further below is a separate, non-matrix leg (macOS/iOS
    # SDK, not a CLI binary) but its asset is folded into the same TARGETS list
    # -- keep that in sync too. Legs marked `experimental: true` are NOT in
    # TARGETS (they may drop out until proven green), so keep them out of it.
    strategy:
      fail-fast: false
      # Include rows live in tooling/release-manifest/release_binaries_matrix.json
      # so only_target can drop unselected legs before any uses: download.
      matrix:
        include: ${{ fromJSON(needs.select-matrix.outputs.include) }}

    steps:
      # Official CUDA/ROCm devel images do not ship git. Without it,
      # actions/checkout falls back to the REST zip API and cannot fetch
      # submodules. Install git first, mark the workspace safe, then use
      # the same checkout as every other leg.
      - name: Install git (official GPU image)
        if: ${{ contains(matrix.container, 'nvidia/cuda') || contains(matrix.container, 'rocm/') }}
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -y
          apt-get install -y --no-install-recommends git ca-certificates
          git config --global --add safe.directory '*'

      - uses: actions/checkout@v7
        with:
          submodules: recursive
          ref: ${{ needs.select-matrix.outputs.source_digest }}

      - name: Resolve workspace version
        shell: bash
        # Single source of truth: [workspace.package] version in the root
        # Cargo.toml (same extraction release-core.yml uses). Archives are
        # named openasr-<version>-<target>.<ext> to match the release assets.
        run: |
          set -euo pipefail
          version="$(grep -m1 -E '^version = "' Cargo.toml | sed -E 's/^version = "([^"]+)".*/\1/')"
          if [ -z "${version}" ]; then
            echo "could not read workspace version from Cargo.toml" >&2
            exit 1
          fi
          echo "OPENASR_VERSION=${version}" >> "${GITHUB_ENV}"

      - name: Prepare Linux container
        if: runner.os == 'Linux' && matrix.container
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if command -v openasr-ci-verify >/dev/null 2>&1; then
            openasr-ci-verify
          fi

      - name: Install Linux audio build dependencies
        if: runner.os == 'Linux' && !matrix.container
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Install Linux Vulkan SDK
        if: runner.os == 'Linux' && contains(matrix.features, 'vulkan')
        # LunarG's apt recipe for jammy (matches llama.cpp's ubuntu-22.04)
        # Vulkan release job). vulkan-sdk gives cmake's FindVulkan the
        # loader/headers/glslc it needs; mesa-vulkan-drivers gives the
        # llvmpipe software ICD, so the produced binary can actually launch
        # and run CPU-emulated Vulkan on this GPU-less runner.
        run: |
          set -euo pipefail
          wget -qO - https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo apt-key add -
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-jammy.list https://packages.lunarg.com/vulkan/lunarg-vulkan-jammy.list
          sudo apt-get update -y
          sudo apt-get install -y vulkan-sdk mesa-vulkan-drivers

      # The ROCm SDK plus the fat multi-gfx build overflow the hosted
      # runner's disk (observed "No space left on device"); drop the
      # preinstalled toolchains this job never touches first. Same action
      # llama.cpp's ubuntu-rocm release job uses.
      - name: Free up disk space
        if: runner.os == 'Linux' && contains(matrix.features, 'hip') && !matrix.container
        uses: ./.github/actions/free-disk-space
        with:
          tool-cache: true

      - name: Install Linux ROCm/HIP SDK
        if: runner.os == 'Linux' && contains(matrix.features, 'hip') && !contains(matrix.container, 'rocm/') && !contains(matrix.container, 'openasr-ci-linux-rocm')
        # AMD's official apt repo (the recipe llama.cpp's ubuntu-22-rocm)
        # release job uses). rocm-hip-sdk provides hipcc/the HIP clang
        # toolchain, rocBLAS, and hipBLAS; ROCM_PATH lets both cmake's
        # FindHIP language support and openasr-core's build.rs
        # hip_toolkit_path() locate it.
        run: |
          set -euo pipefail
          sudo mkdir --parents --mode=0755 /etc/apt/keyrings
          wget -qO - https://repo.radeon.com/rocm/rocm.gpg.key | sudo gpg --dearmor -o /etc/apt/keyrings/rocm.gpg
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/rocm.gpg] https://repo.radeon.com/rocm/apt/7.2.1 jammy main" \
            | sudo tee /etc/apt/sources.list.d/rocm.list
          printf 'Package: *\nPin: release o=repo.radeon.com\nPin-Priority: 600\n' \
            | sudo tee /etc/apt/preferences.d/rocm-pin-600
          sudo apt-get update -y
          sudo apt-get install -y rocm-hip-sdk
          echo "ROCM_PATH=/opt/rocm" >> "${GITHUB_ENV}"
          echo "/opt/rocm/bin" >> "${GITHUB_PATH}"

      - name: Install Windows Vulkan SDK
        if: runner.os == 'Windows' && env.NEEDS_WINDOWS_VULKAN_SDK == 'true'
        shell: pwsh
        env:
          VULKAN_VERSION: 1.4.313.2
        # LunarG silent install (the recipe llama.cpp's Windows Vulkan CI
        # uses). Provides vulkan-1.lib, glslc, SPIRV-Headers, and the loader
        # runtime that lets the produced exe launch on this GPU-less runner.
        run: |
          curl.exe --fail --location --retry 3 `
            --output "$env:RUNNER_TEMP\vulkan-sdk-installer.exe" `
            "https://sdk.lunarg.com/sdk/download/$env:VULKAN_VERSION/windows/vulkansdk-windows-X64-$env:VULKAN_VERSION.exe"
          & "$env:RUNNER_TEMP\vulkan-sdk-installer.exe" --accept-licenses --default-answer --confirm-command install | Out-Null
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\VulkanSDK\$env:VULKAN_VERSION"
          Add-Content $env:GITHUB_PATH "C:\VulkanSDK\$env:VULKAN_VERSION\Bin"

      - name: Install MSVC ARM64 build tools
        if: matrix.rust_target == 'aarch64-pc-windows-msvc'
        shell: pwsh
        # windows-latest preinstalls VS with only the x86_64 v143 toolset.
        # build.rs cross-compiles ggml for aarch64-pc-windows-msvc via
        # cc::windows_registry::find_tool(target=aarch64-...), which needs the
        # Hostx64/arm64 `cl.exe` from the "VC.Tools.ARM64" component. Modify
        # the existing VS install in place rather than provisioning a second
        # VS install.
        run: |
          $ErrorActionPreference = "Stop"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -latest -products * -property installationPath
          if (-not $installPath) { Write-Error "no Visual Studio installation found"; exit 1 }
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
          $proc = Start-Process -FilePath $installer -ArgumentList @(
            "modify",
            "--installPath", "`"$installPath`"",
            "--add", "Microsoft.VisualStudio.Component.VC.Tools.ARM64",
            "--quiet", "--norestart", "--nocache"
          ) -NoNewWindow -PassThru -Wait
          if ($proc.ExitCode -ne 0) {
            Write-Error "vs_installer modify failed with exit code $($proc.ExitCode)"
            exit 1
          }

      - name: Ensure clang-cl (windows-arm64)
        if: matrix.rust_target == 'aarch64-pc-windows-msvc'
        shell: pwsh
        # ggml's ARM CPU backend refuses MSVC cl ("MSVC is not supported for
        # ARM, use clang"), so build.rs compiles this cross with clang-cl (which
        # still links the MSVC ARM64 libs installed above). windows-latest
        # preinstalls LLVM, but pull it via choco if a runner image ever drops
        # it. build.rs invokes `clang-cl` off PATH.
        run: |
          $existing = Get-Command clang-cl -ErrorAction SilentlyContinue
          if ($existing) {
            $clangClPath = $existing.Source
          } else {
            $llvmBin = "C:\Program Files\LLVM\bin"
            if (-not (Test-Path "$llvmBin\clang-cl.exe")) { choco install llvm -y }
            Add-Content $env:GITHUB_PATH $llvmBin
            $clangClPath = "$llvmBin\clang-cl.exe"
          }
          # GITHUB_PATH only affects later steps; verify via the resolved path so
          # this step works even right after a fresh install.
          & $clangClPath --version

      - name: Ensure Ninja
        if: runner.os == 'Windows' && (contains(matrix.features, 'vulkan') || contains(matrix.features, 'cuda') || contains(matrix.features, 'hip') || matrix.rust_target == 'aarch64-pc-windows-msvc')
        shell: pwsh
        # build.rs forces the Ninja generator for Windows GPU-feature builds
        # and the windows-arm64 cross leg (Linux keeps cmake's default Unix
        # Makefiles generator).
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja -y }
          ninja --version

      - name: Cache AMD HIP SDK install
        if: runner.os == 'Windows' && contains(matrix.features, 'hip')
        id: cache-hip-sdk
        uses: actions/cache@v6
        with:
          path: C:\Program Files\AMD\ROCm
          key: hip-sdk-${{ env.HIPSDK_INSTALLER_VERSION }}-${{ runner.os }}

      - name: Install AMD HIP SDK
        if: runner.os == 'Windows' && contains(matrix.features, 'hip') && steps.cache-hip-sdk.outputs.cache-hit != 'true'
        shell: pwsh
        # Same recipe llama.cpp's Windows HIP release job uses (no self-hosted
        # runner needed): AMD publishes a silent installer for the consumer
        # "PRO Edition" HIP SDK directly, so a GitHub-hosted windows-latest
        # runner can provision it like any other toolchain.
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://download.amd.com/developer/eula/rocm-hub/AMD-Software-PRO-Edition-$env:HIPSDK_INSTALLER_VERSION-Win11-For-HIP.exe"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\rocm-install.exe"
          $proc = Start-Process "$env:RUNNER_TEMP\rocm-install.exe" -ArgumentList '-install' -NoNewWindow -PassThru
          if (-not $proc.WaitForExit(600000)) {
            Write-Error "AMD HIP SDK installation timed out after 10 minutes."
            $proc.Kill()
            exit 1
          }
          if ($proc.ExitCode -ne 0) {
            Write-Error "AMD HIP SDK installation failed with exit code $($proc.ExitCode)"
            exit 1
          }

      - name: Resolve HIP SDK path
        if: runner.os == 'Windows' && contains(matrix.features, 'hip')
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $clang = Get-ChildItem 'C:\Program Files\AMD\ROCm\*\bin\clang.exe' | Select-Object -First 1
          if (-not $clang) { Write-Error "AMD HIP SDK not found under C:\Program Files\AMD\ROCm"; exit 1 }
          $hipRoot = $clang.Directory.Parent.FullName
          & $clang.FullName --version
          Add-Content $env:GITHUB_ENV "HIP_PATH=$hipRoot"
          Add-Content $env:GITHUB_PATH "$hipRoot\bin"

      - name: Install CUDA toolkit (Linux)
        if: runner.os == 'Linux' && contains(matrix.features, 'cuda') && !contains(matrix.container, 'nvidia/cuda') && !contains(matrix.container, 'openasr-ci-linux-cuda')
        uses: ./.github/actions/install-cuda-toolkit-linux
        with:
          cuda: "13.2.0"
          method: network
          # The Linux apt repo splits CUDA 13 differently from the Windows
          # silent installer: nvvm is folded into cuda-nvcc, the CUB/Thrust
          # headers live in cuda-cccl, cuBLAS is a lib* package (installed
          # via non-cuda-sub-packages below), and the libcuda.so driver stub
          # ggml-cuda's VMM path links against comes from cuda-driver-dev.
          sub-packages: '["nvcc", "crt", "cudart", "cudart-dev", "cccl", "driver-dev"]'
          non-cuda-sub-packages: '["libcublas", "libcublas-dev"]'
          use-github-cache: true

      - name: Install CUDA toolkit (Windows)
        if: runner.os == 'Windows' && contains(matrix.features, 'cuda')
        uses: ./.github/actions/install-cuda-toolkit-windows
        with:
          # Keep the released Windows plugin on the CUDA 12 ABI so installed
          # RTX systems with a CUDA-12-capable production driver (including
          # the validated 566.36 / Driver API 12.7 lane) can load it. Both
          # CUDA matrix legs are pinned to windows-2022 below: CUDA 12 rejects
          # the VS 2026 host compiler on windows-latest, while the v143 toolset
          # is also the host ABI contract recorded in the plugin manifest.
          # No VS-integration sub-package: build.rs uses Ninja directly.
          cuda: ${{ matrix.cuda_toolkit || '12.6.3' }}
          method: network
          # Use only component names published by the CUDA 12.6 Windows
          # network installer. `crt` and `nvvm` are not standalone 12.6
          # components (they were added to later toolkit layouts), so asking
          # the installer for either fails before any build starts. `nvcc`
          # carries the compiler payload; cudart supplies the runtime DLL,
          # cublas(+dev) the GEMM library, and thrust the CUB/CCCL headers.
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "thrust"]'
          use-github-cache: true

      - name: Install official Linux GPU image extras
        if: runner.os == 'Linux' && (contains(matrix.container, 'nvidia/cuda') || contains(matrix.container, 'rocm/'))
        # Fallback only if a matrix row still points at an official NVIDIA/ROCm
        # devel image. Current CUDA/ROCm legs use GHCR wrappers and skip this.
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -y
          apt-get install -y --no-install-recommends \
            cmake ninja-build libasound2-dev pkg-config git curl python3 ca-certificates
          if [ -d /usr/local/cuda ]; then
            echo "CUDA_PATH=/usr/local/cuda" >> "${GITHUB_ENV}"
            echo "CUDA_HOME=/usr/local/cuda" >> "${GITHUB_ENV}"
          fi
          if [ -d /opt/rocm ]; then
            echo "ROCM_PATH=/opt/rocm" >> "${GITHUB_ENV}"
            echo "HIP_PATH=/opt/rocm" >> "${GITHUB_ENV}"
            echo "/opt/rocm/bin" >> "${GITHUB_PATH}"
          fi

      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none --profile minimal
            echo "${HOME}/.cargo/bin" >> "${GITHUB_PATH}"
            export PATH="${HOME}/.cargo/bin:${PATH}"
          fi
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0
          rustc --version
          cargo --version

      # Cross legs (matrix.rust_target set, e.g. the windows-arm64 experimental
      # leg) need their std installed for the target triple; native legs skip
      # this. Runs in the default shell (pwsh on Windows, bash elsewhere); the
      # `rustup target add` invocation is identical in both.
      - name: Add cross Rust target
        if: matrix.rust_target
        run: rustup target add ${{ matrix.rust_target }}

      - uses: ./.github/actions/rust-cache
        id: rust-cache
        continue-on-error: true
        with:
          shared-key: release-binaries-${{ matrix.target }}

      - name: Report rust-cache outcome
        if: steps.rust-cache.outcome != 'success'
        shell: bash
        run: echo "::warning::rust-cache failed (outcome=${{ steps.rust-cache.outcome }}); continuing compile without cache"

      # musl legs are cross-compiled with cargo-zigbuild: zig cc/c++ is a
      # self-contained clang + bundled musl libc/libc++ cross toolchain, so no
      # apt musl-cross (or the flaky musl.cc download) is needed. ziglang ships
      # as a pip wheel (cargo-zigbuild auto-discovers `python3 -m ziglang`); the
      # target std comes from the "Add cross Rust target" step above.
      - name: Install musl cross build toolchain
        if: matrix.zigbuild
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --user ziglang
          cargo install cargo-zigbuild --version 0.23.0 --locked
          python3 -m ziglang version

      # ggml's CPU backend pulls in ALSA transitively (openasr-cli -> cpal ->
      # alsa-sys) on Linux, and a fully static musl binary needs a musl-built
      # static libasound.a -- the runner's apt libasound2-dev is glibc-only.
      # Cross-build ALSA from its official release tarball with the same zig cc
      # (targeting <arch>-linux-musl), then point alsa-sys' pkg-config probe at
      # it via the target-scoped PKG_CONFIG_* vars (PKG_CONFIG_LIBDIR_<target>
      # replaces the search path so the host glibc alsa.pc is never picked).
      - name: Build static ALSA for musl
        if: matrix.zigbuild
        shell: bash
        env:
          ALSA_VERSION: 1.2.13
        run: |
          set -euo pipefail
          arch="${{ matrix.rust_target }}"; arch="${arch%%-*}"   # x86_64 | aarch64
          zig_triple="${arch}-linux-musl"
          wrapper="${RUNNER_TEMP}/zigcc-${arch}.sh"
          cat > "${wrapper}" <<EOF
          #!/bin/sh
          exec python3 -m ziglang cc -target ${zig_triple} "\$@"
          EOF
          chmod +x "${wrapper}"

          cd "${RUNNER_TEMP}"
          curl -fL --retry 5 --retry-all-errors --connect-timeout 30 \
            -o alsa-lib.tar.bz2 \
            "https://www.alsa-project.org/files/pub/lib/alsa-lib-${ALSA_VERSION}.tar.bz2"
          tar xjf alsa-lib.tar.bz2
          cd "alsa-lib-${ALSA_VERSION}"
          CC="${wrapper}" ./configure \
            --host="${zig_triple}" \
            --prefix="${RUNNER_TEMP}/alsa-musl" \
            --enable-static --disable-shared --disable-python \
            --disable-topology --disable-ucm --disable-alisp --disable-old-symbols
          CC="${wrapper}" make -j"$(nproc)"
          CC="${wrapper}" make install

          # Target-scoped pkg-config wiring so alsa-sys probes the freshly
          # cross-built static libasound instead of the host's glibc one.
          et="$(echo "${{ matrix.rust_target }}" | tr '-' '_')"
          pc_dir="${RUNNER_TEMP}/alsa-musl/lib/pkgconfig"
          {
            echo "PKG_CONFIG_ALLOW_CROSS=1"
            echo "PKG_CONFIG_ALLOW_CROSS_${et}=1"
            echo "PKG_CONFIG_PATH_${et}=${pc_dir}"
            echo "PKG_CONFIG_LIBDIR_${et}=${pc_dir}"
            echo "PKG_CONFIG_SYSROOT_DIR_${et}=${RUNNER_TEMP}/alsa-musl"
          } >> "${GITHUB_ENV}"

      - name: Build release binary
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.distribution }}" = "plugin" ]; then
            crate="openasr-core"
          else
            crate="openasr-cli"
          fi
          if [ "${{ matrix.zigbuild }}" = "true" ]; then
            cargo zigbuild --release -p "${crate}" --target ${{ matrix.rust_target }} ${{ matrix.features && format('--features {0}', matrix.features) || '' }}
          else
            cargo build --release -p "${crate}" ${{ matrix.rust_target && format('--target {0}', matrix.rust_target) || '' }} ${{ matrix.features && format('--features {0}', matrix.features) || '' }}
          fi

      # Same GPU-less-runner caveat as the Windows CUDA/HIP legs: those two
      # exes dlopen the CUDA/ROCm runtime at launch, which needs a real
      # driver this runner does not have. The Vulkan exe launches fine via
      # the llvmpipe software ICD installed above.
      # Cross legs (matrix.rust_target set) build an exe for a foreign arch the
      # runner cannot execute, so they skip every smoke step (build + package
      # validation only).
      - name: Smoke release binary
        if: runner.os != 'Windows' && !contains(matrix.features, 'cuda') && !contains(matrix.features, 'hip') && !matrix.rust_target
        run: |
          "${RELEASE_DIR}/openasr" --version
          "${RELEASE_DIR}/openasr" --help
          "${RELEASE_DIR}/openasr" list

      # The CUDA exe import-links nvcuda.dll (NVIDIA driver) and the HIP exe
      # import-links amdhip64.dll (AMD driver), neither of which this GPU-less
      # runner has, so those cannot launch here: build + package only. The
      # Vulkan exe resolves against the SDK loader installed above, so it
      # launches and runs CPU paths here.
      - name: Smoke release binary
        if: runner.os == 'Windows' && !contains(matrix.features, 'cuda') && !contains(matrix.features, 'hip') && !matrix.rust_target
        shell: pwsh
        run: |
          & "$env:RELEASE_DIR\openasr.exe" --version
          & "$env:RELEASE_DIR\openasr.exe" --help
          & "$env:RELEASE_DIR\openasr.exe" list

      - name: Restore model pack cache
        if: matrix.target == 'x86_64-pc-windows-msvc'
        uses: actions/cache@v6
        with:
          path: ~/.openasr/models
          key: openasr-packs-whisper-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('model-registry/catalog.json') }}

      - name: Real-model CPU smoke
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: bash
        # Full-chain smoke for the CPU package: mock backend end to end, then
        # a real signature-verified pull + native CPU transcription of the
        # committed fixture (same chain family-regression exercises on
        # Linux/macOS, which have no Windows lane).
        run: |
          set -euo pipefail
          ./target/release/openasr.exe transcribe fixtures/jfk.wav --model whisper-small --backend mock --format json
          ./target/release/openasr.exe pull whisper-tiny:q4 --accept-license
          mkdir -p tmp
          OPENASR_GGML_BACKEND=cpu ./target/release/openasr.exe transcribe fixtures/jfk.wav \
            --model whisper-tiny:q4 --format text --output tmp/jfk.txt
          cat tmp/jfk.txt
          grep -qi "your country" tmp/jfk.txt

      - name: Package archive
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          archive="openasr-${OPENASR_VERSION}-${{ matrix.asset }}"
          dist_dir="dist/${archive}"
          mkdir -p "$dist_dir/docs"
          cp "${RELEASE_DIR}/${{ matrix.binary_name }}" "$dist_dir/"
          if [ "${{ matrix.features }}" = "cuda" ]; then
            # The CUDA exe dlopens the CUDA runtime; ship NVIDIA's
            # redistributable runtime .so files so end users only need a
            # GPU driver, not a CUDA toolkit install.
            find "${CUDA_PATH}/lib64" -maxdepth 1 \( -name 'libcudart.so*' -o -name 'libcublas.so*' -o -name 'libcublasLt.so*' \) \
              -exec cp {} "$dist_dir/" \;
          fi
          if [ "${{ matrix.features }}" = "hip" ]; then
            # The HIP exe dlopens the ROCm runtime + rocBLAS; ship them (and
            # rocBLAS's per-arch Tensile "library" dir, loaded at first
            # matmul, not at launch) so end users only need a GPU driver,
            # not the full ROCm SDK.
            cp "${ROCM_PATH}"/lib/libamdhip64.so* "${ROCM_PATH}"/lib/libhipblas.so* "${ROCM_PATH}"/lib/librocblas.so* "$dist_dir/"
            mkdir -p "$dist_dir/rocblas/library"
            cp "${ROCM_PATH}"/lib/rocblas/library/* "$dist_dir/rocblas/library/"
          fi
          cp README.md LICENSE "$dist_dir/"
          cp -R model-registry "$dist_dir/model-registry"
          cp docs/FAQ.md docs/KNOWN_LIMITATIONS.md "$dist_dir/docs/"
          tar -czf "dist/${archive}.${{ matrix.archive_ext }}" -C dist "${archive}"

      - name: Stage archive contents
        if: runner.os == 'Windows'
        shell: pwsh
        # Split out of the old single "Package archive" step so Authenticode
        # signing (below) can run on the staged, unzipped files -- signing
        # has to happen before Compress-Archive, not after, or the exe/dll
        # bytes inside the shipped zip would stay unsigned.
        run: |
          $ErrorActionPreference = "Stop"
          $archive = "openasr-$env:OPENASR_VERSION-${{ matrix.asset }}"
          $distDir = "dist\$archive"
          New-Item -ItemType Directory -Force -Path "$distDir\docs" | Out-Null
          $distribution = "${{ matrix.distribution }}"
          $provider = "${{ matrix.provider }}"
          if ($distribution -eq "plugin") {
            $pluginSource = Join-Path $env:RELEASE_DIR "openasr-backend-packs\$provider\ggml-$provider.dll"
            if (-not (Test-Path $pluginSource)) {
              Write-Error "optional backend module was not staged at $pluginSource"
            }
            $pluginAsset = "dist\$archive.dll"
            Copy-Item $pluginSource $pluginAsset -Force
            Copy-Item (Join-Path $env:RELEASE_DIR "openasr-backend-packs\$provider\openasr-backend-host-abi-v1.json") $distDir -Force
            Copy-Item (Join-Path $env:RELEASE_DIR "openasr-backend-packs\$provider\openasr-backend-build-v1.json") $distDir -Force
            Add-Content $env:GITHUB_ENV "PLUGIN_ASSET_PATH=$pluginAsset"
            $targetPack = if ($provider -eq "cuda") {
              "sm_${{ matrix.cuda_gpu_target }}"
            } elseif ($provider -eq "hip") {
              "${{ matrix.hip_gpu_target }}"
            } else {
              "generic"
            }
            if ([string]::IsNullOrWhiteSpace($targetPack)) {
              Write-Error "target-scoped plugin leg has no GPU target"
            }
            Add-Content $env:GITHUB_ENV "BACKEND_PACK_NAME=backend-pack-$provider-$targetPack.json"
          } else {
            Copy-Item "$env:RELEASE_DIR\${{ matrix.binary_name }}" "$distDir\"
          }
          # The CPU base build is a GGML_BACKEND_DL build (build.rs):
          # openasr.exe dynamically loads the core (ggml-base.dll + ggml.dll)
          # and the CPU backend plugins (ggml-cpu-<variant>.dll) at startup, so
          # the archive must carry them or the binary cannot launch. build.rs
          # stages them next to the binary in target/release. Windows plugin
          # legs also build a neutral host, but publish only the selected
          # optional module below; non-Windows GPU builds remain
          # platform-static.
          if ($distribution -ne "plugin") {
            Get-ChildItem "$env:RELEASE_DIR" -Filter "ggml*.dll" | Copy-Item -Destination "$distDir\"
            Get-ChildItem "$env:RELEASE_DIR" -Filter "openasr-backend-*-v1.json" -ErrorAction SilentlyContinue |
              Copy-Item -Destination "$distDir\"
          }
          # Optional-plugin vendor GPU runtime DLLs (NVIDIA cudart/
          # cuBLAS, AMD rocBLAS/hipBLAS) are staged into a SEPARATE directory
          # from $distDir and the target-scoped plugin, so they
          # can ship as their own large, content-addressed `vendor_layers`
          # archive instead -- see the "Build deterministic vendor archive"
          # step below. Keeping the vendor layer cached and version-independent
          # means a core upgrade does not re-download the multi-hundred-MB GPU
          # runtime when its content hash is unchanged.
          # The per-core plugin can itself still be large and must not
          # be described to users as a small or zero-download update.
          if ($distribution -eq "plugin") {
            $vendorDir = "dist\$archive-vendor"
            New-Item -ItemType Directory -Force -Path $vendorDir | Out-Null
            Add-Content $env:GITHUB_ENV "VENDOR_DIR=$vendorDir"
          }
          if ($distribution -eq "plugin" -and $provider -eq "cuda") {
            # The CUDA exe dynamically links the CUDA runtime; ship NVIDIA's
            # redistributable runtime DLLs so end users only need a GPU driver
            # (nvcuda.dll), not a CUDA toolkit install.
            $cudaDlls = Get-ChildItem (Join-Path $env:CUDA_PATH "bin") -Recurse -File |
              Where-Object { $_.Name -match '^(cudart64|cublas64|cublasLt64)_.*\.dll$' }
            if (-not $cudaDlls) { Write-Error "no CUDA runtime DLLs found under $env:CUDA_PATH\bin" }
            $cudaDlls | Copy-Item -Destination $vendorDir
            Add-Content $env:GITHUB_ENV "VENDOR_LAYER_KEY=cuda-runtime"
          }
          if ($distribution -eq "plugin" -and $provider -eq "hip") {
            # The HIP exe dynamically links the ROCm runtime + BLAS; ship AMD's
            # redistributable DLLs (and rocBLAS's per-arch Tensile "library"
            # dir it loads at runtime -- omitting it fails at first matmul,
            # not at launch) so end users only need a GPU driver, not the HIP
            # SDK. hipBLASLt is optional (only some archs/tunings dispatch to
            # it); copy it too when the SDK ships it.
            $hipBin = Join-Path $env:HIP_PATH "bin"
            $hipDlls = Get-ChildItem $hipBin -File |
              Where-Object { $_.Name -match '^(amdhip64|libhipblas|rocblas|libhipblaslt)(_\d+)?\.dll$' }
            if (-not $hipDlls) { Write-Error "no HIP runtime DLLs found under $hipBin" }
            $hipDlls | Copy-Item -Destination $vendorDir
            New-Item -ItemType Directory -Force -Path "$vendorDir\rocblas\library" | Out-Null
            Copy-Item (Join-Path $hipBin "rocblas\library\*") "$vendorDir\rocblas\library\"
            $hipbltLibrary = Join-Path $hipBin "hipblaslt\library"
            if (Test-Path $hipbltLibrary) {
              New-Item -ItemType Directory -Force -Path "$vendorDir\hipblaslt\library" | Out-Null
              Copy-Item (Join-Path $hipbltLibrary "*") "$vendorDir\hipblaslt\library\"
            }
            Add-Content $env:GITHUB_ENV "VENDOR_LAYER_KEY=rocm-runtime"
          }
          if ($distribution -ne "plugin") {
            Copy-Item README.md,LICENSE "$distDir\"
            Copy-Item model-registry "$distDir\model-registry" -Recurse
            Copy-Item docs\FAQ.md,docs\KNOWN_LIMITATIONS.md "$distDir\docs\"
          }
          Add-Content $env:GITHUB_ENV "DIST_DIR=$distDir"
          Add-Content $env:GITHUB_ENV "ARCHIVE_NAME=$archive"

      - name: Verify optional backend PE contract
        if: runner.os == 'Windows' && matrix.distribution == 'plugin'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $provider = "${{ matrix.provider }}"
          $plugin = $env:PLUGIN_ASSET_PATH
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsRoot = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsRoot) { Write-Error "Visual Studio C++ tools are unavailable" }
          $dumpbin = Get-ChildItem "$vsRoot\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $dumpbin) { Write-Error "dumpbin.exe is unavailable under $vsRoot" }

          $imports = (& $dumpbin.FullName /nologo /imports $plugin 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) { Write-Error "dumpbin imports failed for $plugin" }
          $exports = (& $dumpbin.FullName /nologo /exports $plugin 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) { Write-Error "dumpbin exports failed for $plugin" }
          $headers = (& $dumpbin.FullName /nologo /headers $plugin 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) { Write-Error "dumpbin headers failed for $plugin" }

          if ($headers -notmatch '(?im)^\s*8664 machine \(x64\)') {
            Write-Error "$provider plugin is not an x64 PE image"
          }
          foreach ($requiredExport in @(
            'ggml_backend_init',
            'openasr_ggml_backend_abi_v1',
            'openasr_ggml_backend_probe_v1',
            'openasr_ggml_backend_provider_v1'
          )) {
            if ($exports -notmatch "(?im)\s$([regex]::Escape($requiredExport))\s*$") {
              Write-Error "$provider plugin does not export $requiredExport"
            }
          }
          if ($imports -notmatch '(?im)^\s*ggml-base\.dll\s*$') {
            Write-Error "$provider plugin does not import the shared ggml-base.dll host ABI"
          }
          if ($imports -match '(?im)^\s*ggml\.dll\s*$') {
            Write-Error "$provider plugin must not import the ggml registry DLL"
          }

          if ($provider -eq 'cuda') {
            foreach ($requiredImport in @('cudart64_', 'cublas64_', 'nvcuda.dll')) {
              if ($imports -notmatch "(?im)^\s*$([regex]::Escape($requiredImport))") {
                Write-Error "CUDA plugin does not import $requiredImport"
              }
            }
            if ($imports -match '(?im)^\s*(amdhip64|libhipblas|rocblas)') {
              Write-Error "CUDA plugin unexpectedly imports a HIP runtime"
            }
          } elseif ($provider -eq 'hip') {
            # The plugin directly imports HIP + hipBLAS. rocBLAS is hipBLAS's
            # transitive provider and is validated in the signed vendor-layer
            # tree below; requiring a direct plugin import rejects a correct
            # ROCm 7.1 link because the linker removes that unused edge.
            foreach ($requiredImport in @('amdhip64', 'libhipblas')) {
              if ($imports -notmatch "(?im)^\s*$([regex]::Escape($requiredImport))") {
                Write-Error "HIP plugin does not import $requiredImport"
              }
            }
            if ($imports -match '(?im)^\s*(cudart64_|cublas64_|nvcuda\.dll)') {
              Write-Error "HIP plugin unexpectedly imports a CUDA runtime"
            }
          } elseif ($provider -eq 'vulkan') {
            if ($imports -notmatch '(?im)^\s*vulkan-1\.dll\s*$') {
              Write-Error "Vulkan plugin does not import the pinned Vulkan loader"
            }
            if ($imports -match '(?im)^\s*(cudart64_|cublas64_|nvcuda\.dll|amdhip64|libhipblas|rocblas)') {
              Write-Error "Vulkan plugin unexpectedly imports a CUDA/HIP runtime"
            }
          } else {
            Write-Error "unsupported optional backend provider '$provider'"
          }

      # Cache the downloaded LunarG archive across runs (retries, re-dispatch)
      # so the ~19MB fetch only happens once per pinned VULKAN_LOADER_VERSION,
      # not once per run -- same idea as the "Cache AMD HIP SDK install" step
      # above. The staging step below still re-verifies the hash on every run
      # regardless of cache hit, so a stale/corrupted cache entry can never
      # silently pass.
      - name: Cache Vulkan loader redistributable
        if: runner.os == 'Windows' && env.BUNDLES_WINDOWS_VULKAN_LOADER == 'true'
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}\vulkan-runtime-components.zip
          key: vulkan-loader-${{ env.VULKAN_LOADER_VERSION }}

      - name: Stage Vulkan loader (LunarG VulkanRT redistributable)
        if: runner.os == 'Windows' && env.BUNDLES_WINDOWS_VULKAN_LOADER == 'true'
        shell: pwsh
        # The optional ggml-vulkan.dll import table names vulkan-1.dll
        # Vulkan::Vulkan, the SYSTEM Vulkan loader import lib) -- the loader
        # itself is a thin, GPU-vendor-agnostic dispatch shim that does NOT
        # require a GPU or driver to LOAD, only to enumerate a device later.
        # The loader is kept inside the verified optional vendor tree; a
        # machine without it keeps running on bundled CPU because Vulkan bytes
        # never enter the neutral process before signed activation.
        #
        # Fix: LunarG's Windows Vulkan Runtime redistributable ships the SAME
        # vulkan-1.dll every GPU driver installs, under a license (Apache-2.0
        # governs the loader itself; see VulkanRT-License.txt inside the
        # archive) that explicitly permits redistribution, entirely
        # independent of any GPU driver. Staging a pinned, hash-verified copy
        # beside the optional plugin supplies one immutable dependency set.
        # Fail-closed throughout: a download
        # failure, a hash mismatch at either layer, or a missing extracted
        # file all throw -- there is no silent fallback to an unverified DLL.
        run: |
          $ErrorActionPreference = "Stop"
          $archivePath = Join-Path $env:RUNNER_TEMP "vulkan-runtime-components.zip"

          function Get-Sha256Hex($path) {
            (Get-FileHash -Path $path -Algorithm SHA256).Hash.ToLowerInvariant()
          }

          $needDownload = $true
          if (Test-Path $archivePath) {
            if ((Get-Sha256Hex $archivePath) -eq $env:VULKAN_LOADER_ARCHIVE_SHA256) {
              Write-Host "stage-vulkan-loader: reusing cached $archivePath (sha256 verified)."
              $needDownload = $false
            } else {
              Write-Host "stage-vulkan-loader: cached $archivePath failed sha256 verification -- re-downloading."
              Remove-Item -Force $archivePath
            }
          }
          if ($needDownload) {
            $url = "https://sdk.lunarg.com/sdk/download/$env:VULKAN_LOADER_VERSION/windows/vulkan-runtime-components.zip"
            Write-Host "stage-vulkan-loader: downloading $url ..."
            curl.exe --fail --location --retry 3 --output $archivePath $url
            if ($LASTEXITCODE -ne 0) { Write-Error "download failed (curl exit $LASTEXITCODE)"; exit 1 }
          }

          $actualArchiveSha = Get-Sha256Hex $archivePath
          if ($actualArchiveSha -ne $env:VULKAN_LOADER_ARCHIVE_SHA256) {
            Write-Error ("sha256 mismatch for Vulkan runtime archive: expected $env:VULKAN_LOADER_ARCHIVE_SHA256, got $actualArchiveSha. " +
              "Refusing to stage an unverified Vulkan runtime archive -- if LunarG genuinely rotated this release's bytes, re-pin " +
              "VULKAN_LOADER_ARCHIVE_SHA256 and VULKAN_LOADER_DLL_SHA256 together in this open-core provider workflow, " +
              "cross-checked against https://vulkan.lunarg.com/sdk/sha/$env:VULKAN_LOADER_VERSION/windows/VulkanRT-X64-$env:VULKAN_LOADER_VERSION-Components.zip.json.")
            exit 1
          }

          $extractDir = Join-Path $env:RUNNER_TEMP "vulkan-runtime-components-extracted"
          if (Test-Path $extractDir) { Remove-Item -Recurse -Force $extractDir }
          Expand-Archive -Path $archivePath -DestinationPath $extractDir -Force

          # The zip's top-level folder name is version-specific
          # (VulkanRT-X64-<version>-Components\x64\vulkan-1.dll), so search by
          # filename instead of hardcoding it.
          $dll = Get-ChildItem -Path $extractDir -Recurse -Filter "vulkan-1.dll" |
            Where-Object { $_.FullName -like "*\x64\*" } | Select-Object -First 1
          if (-not $dll) {
            Write-Error "vulkan-1.dll not found under $extractDir\*\x64 -- archive layout may have changed."
            exit 1
          }

          $actualDllSha = Get-Sha256Hex $dll.FullName
          if ($actualDllSha -ne $env:VULKAN_LOADER_DLL_SHA256) {
            Write-Error ("Extracted vulkan-1.dll sha256 $actualDllSha does not match the pinned $env:VULKAN_LOADER_DLL_SHA256. " +
              "The archive's own sha256 already verified against LunarG's published hash, so this means the archive's internal " +
              "layout changed (wrong file extracted) -- refusing to stage an unverified DLL.")
            exit 1
          }

          $runtimeDestination = if ("${{ matrix.distribution }}" -eq "plugin" -and "${{ matrix.provider }}" -eq "vulkan") {
            $env:VENDOR_DIR
          } else {
            $env:DIST_DIR
          }
          Copy-Item $dll.FullName (Join-Path $runtimeDestination "vulkan-1.dll") -Force
          Write-Host "stage-vulkan-loader: staged $(Join-Path $runtimeDestination 'vulkan-1.dll') (Vulkan runtime $env:VULKAN_LOADER_VERSION, sha256 $actualDllSha)."

          # Ship the loader's own upstream license text verbatim (from the
          # same downloaded, hash-verified archive -- not hand-transcribed)
          # so the Apache-2.0-licensed redistributable carries its required
          # attribution inside the zip, same as README.md/LICENSE above.
          $licenseSrc = Get-ChildItem -Path $extractDir -Recurse -Filter "VulkanRT-License.txt" | Select-Object -First 1
          if (-not $licenseSrc) {
            Write-Error "VulkanRT-License.txt not found in the Vulkan runtime archive -- archive layout may have changed."
            exit 1
          }
          Copy-Item $licenseSrc.FullName (Join-Path $runtimeDestination "VULKAN-LOADER-LICENSE.txt") -Force
          if ("${{ matrix.distribution }}" -eq "plugin" -and "${{ matrix.provider }}" -eq "vulkan") {
            Add-Content $env:GITHUB_ENV "VENDOR_LAYER_KEY=vulkan-loader"
          }
          Write-Host "stage-vulkan-loader: staged VULKAN-LOADER-LICENSE.txt from the archive's own VulkanRT-License.txt."

      - name: Resolve Windows binaries to sign
        if: runner.os == 'Windows'
        shell: pwsh
        # Only files we actually build ourselves: openasr.exe, plus the CPU
        # leg's own ggml*.dll (compiled from the vendored submodule by this
        # same job, not a third-party redistributable). Deliberately excludes
        # the vendor GPU runtime DLLs (NVIDIA cudart64_*/cublas64_*/
        # cublasLt64_*, AMD amdhip64_*/libhipblas_*/rocblas_*/libhipblaslt_*,
        # LunarG's vulkan-1.dll) -- those are third-party redistributables
        # (some already carrying the vendor's own Authenticode signature) and
        # are not ours to re-sign. Windows-kernel-dist v2 stages the cuda/hip
        # vendor DLLs into $env:VENDOR_DIR, a directory this step never scans
        # (only $env:DIST_DIR), so they are excluded structurally.
        run: |
          $ErrorActionPreference = "Stop"
          if ("${{ matrix.distribution }}" -eq "plugin") {
            $signTargets = @((Resolve-Path $env:PLUGIN_ASSET_PATH).Path)
          } else {
            $signTargets = @((Resolve-Path "$env:DIST_DIR\${{ matrix.binary_name }}").Path)
            $ggmlDlls = Get-ChildItem "$env:DIST_DIR" -Filter "ggml*.dll" -ErrorAction SilentlyContinue
            if ($ggmlDlls) { $signTargets += $ggmlDlls.FullName }
          }
          Write-Host "files to sign ($($signTargets.Count)):"
          $signTargets | ForEach-Object { Write-Host " - $_" }
          Add-Content $env:GITHUB_ENV "SIGN_FILES<<SIGN_FILES_EOF"
          Add-Content $env:GITHUB_ENV ($signTargets -join "`n")
          Add-Content $env:GITHUB_ENV "SIGN_FILES_EOF"

      - name: Check Trusted Signing credentials
        if: runner.os == 'Windows'
        id: signing-check
        shell: bash
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        # This workflow has no `pull_request` trigger (see the trigger
        # comment at the top of this file), so a fork PR never reaches this
        # job with -- or without -- secrets. Every run that gets here is a
        # release-core.yml's workflow_call or a maintainer's
        # workflow_dispatch, all of which do have repo secrets. The only
        # legitimate no-secrets case is a maintainer's one-target diagnostic,
        # which never reaches aggregation, attestation, or release upload.
        run: |
          set -euo pipefail
          if [ -n "${AZURE_TENANT_ID:-}" ] && [ -n "${AZURE_CLIENT_ID:-}" ] && [ -n "${AZURE_CLIENT_SECRET:-}" ]; then
            echo "have_secrets=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_secrets=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Refuse to ship an unsigned Windows release binary
        if: runner.os == 'Windows' && steps.signing-check.outputs.have_secrets != 'true' && inputs.formal_release == true
        shell: bash
        run: |
          echo "::error::AZURE_TENANT_ID/AZURE_CLIENT_ID/AZURE_CLIENT_SECRET are not set -- refusing to package an unsigned formal Windows release binary. Manual one-target diagnostics remain non-release Actions artifacts." >&2
          exit 1

      # Azure Trusted Signing (Artifact Signing): same account/certificate
      # profile as the OpenASR Desktop Windows installer (openasr-sign /
      # openasr-codesign, publisher "Caelum Inc.") -- see the desktop product's
      # Windows signing docs for the account itself. The service
      # principal behind these secrets needs the "Artifact Signing
      # Certificate Profile Signer" role on that account (see this repo's
      # docs/RELEASING.md); it may be a different App Registration than the
      # desktop product's, but must be granted the same role on the same
      # account/profile.
      # GitHub's windows runner image stopped shipping a pre-registered PSGallery
      # PowerShell repository (surfaced alongside the Node 20 -> 24 default bump),
      # so azure/trusted-signing-action's internal `Install-Module TrustedSigning
      # -Repository PSGallery` fails with "Unable to find repository 'PSGallery'".
      # Re-register and trust it (non-interactive) before the signing action runs.
      - name: Ensure PSGallery is registered (runner image workaround)
        if: runner.os == 'Windows' && steps.signing-check.outputs.have_secrets == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (-not (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) {
            Register-PSRepository -Default
          }
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Get-PSRepository | Format-Table -AutoSize

      - name: Sign Windows binaries (Azure Trusted Signing)
        if: runner.os == 'Windows' && steps.signing-check.outputs.have_secrets == 'true'
        uses: ./.github/actions/trusted-signing
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://eus.codesigning.azure.net/
          trusted-signing-account-name: openasr-sign
          certificate-profile-name: openasr-codesign
          files: ${{ env.SIGN_FILES }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Package archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ("${{ matrix.distribution }}" -eq "host") {
            # Authenticode changes every PE byte identity. Rebuild the neutral
            # bundle manifest from the final signed DLLs before the staged-dir
            # smoke test; build.rs' pre-signing manifest is only for local Cargo
            # runs and must never be shipped as release evidence.
            python tooling/release-manifest/backend_catalog.py bundle `
              --directory "$env:DIST_DIR" `
              --host-abi "$env:DIST_DIR\openasr-backend-host-abi-v1.json" `
              --out "$env:DIST_DIR\openasr-backend-bundle-v1.json"
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          # Smoke the binary from the staged dist dir (NOT target/release,
          # whose build.rs-seeded DLLs would mask a packaging gap), so a broken
          # archive fails here before it ships. The CUDA/HIP exes cannot
          # launch without a matching GPU driver, so they are exempt
          # (validated on hardware). A cross leg (rust_target set) builds a
          # foreign-arch exe the runner cannot execute, so it is exempt too.
          # Running this AFTER signing also verifies signing did not corrupt
          # the binary.
          if ("${{ matrix.distribution }}" -ne "plugin" -and "${{ matrix.provider }}" -ne "cuda" -and "${{ matrix.provider }}" -ne "hip" -and "${{ matrix.rust_target }}" -eq "") {
            & "$env:DIST_DIR\${{ matrix.binary_name }}" --version
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          if ("${{ matrix.distribution }}" -eq "host" -and "${{ matrix.rust_target }}" -eq "") {
            $doctor = & "$env:DIST_DIR\${{ matrix.binary_name }}" doctor 2>&1 | Out-String
            Write-Host $doctor
            if ($LASTEXITCODE -ne 0) { exit 1 }
            # Optional Vulkan is published inert and cannot enter this neutral
            # host until a signed activation epoch exists. The host smoke owns
            # only the independently verified CPU rescue module.
            if ($doctor -notmatch "CPU backend CPU" -or $doctor -match "CPU backend unavailable") {
              throw "staged neutral host could not initialize its bundled CPU rescue backend"
            }
          }
          if ("${{ matrix.distribution }}" -ne "plugin") {
            Compress-Archive -Path "$env:DIST_DIR" -DestinationPath "dist\$env:ARCHIVE_NAME.${{ matrix.archive_ext }}" -Force
          }

      # Package the vendor GPU runtime DLLs staged into $env:VENDOR_DIR as
      # their own archive, named after
      # (and deduped by) its own sha256 -- see
      # tooling/release-manifest/deterministic_zip.py's module doc for why
      # this can't reuse PowerShell's Compress-Archive (not byte-deterministic,
      # which would defeat the whole point of a content-addressed archive).
      # `shell: bash` (Git Bash, already used by other cross-OS steps in this
      # same job) keeps the sha12-slicing/renaming logic identical to how a
      # maintainer would reproduce this locally, instead of PowerShell string
      # ops. Runs on the runner's preinstalled python3 (falls back to `python`
      # if the image ever drops the python3 alias).
      - name: Build deterministic vendor archive
        if: runner.os == 'Windows' && matrix.distribution == 'plugin'
        shell: bash
        run: |
          set -euo pipefail
          python_bin="python3"
          command -v python3 >/dev/null 2>&1 || python_bin="python"
          raw_zip="${RUNNER_TEMP}/vendor-${{ matrix.provider }}-raw.zip"
          "$python_bin" tooling/release-manifest/deterministic_zip.py create "$raw_zip" "$VENDOR_DIR"
          sha256="$("$python_bin" -c "import hashlib,sys; print(hashlib.sha256(open(sys.argv[1],'rb').read()).hexdigest())" "$raw_zip")"
          short_hash="${sha256:0:12}"
          final_name="openasr-vendor-${VENDOR_LAYER_KEY}-${short_hash}.zip"
          mkdir -p dist
          cp "$raw_zip" "dist/${final_name}"
          echo "VENDOR_ASSET_NAME=${final_name}" >> "$GITHUB_ENV"
          echo "staged dist/${final_name} (vendor layer '${VENDOR_LAYER_KEY}', sha256 ${sha256})"

      - name: Compile optional backend catalog entry
        if: runner.os == 'Windows' && matrix.distribution == 'plugin'
        shell: bash
        run: |
          set -euo pipefail
          min_driver_api="${{ matrix.min_driver_api }}"
          if [ -z "${min_driver_api}" ] && [ "${{ matrix.provider }}" != "vulkan" ]; then
            min_driver_api="12.0.0"
            if [ "${{ matrix.provider }}" = "hip" ]; then min_driver_api="7.2.0"; fi
          fi
          min_driver_args=()
          if [ -n "${min_driver_api}" ]; then
            min_driver_args+=(--minimum-driver-api "$min_driver_api")
          fi
          python_bin="python3"
          command -v python3 >/dev/null 2>&1 || python_bin="python"
          "$python_bin" tooling/release-manifest/backend_catalog.py compile \
            --build-manifest "$DIST_DIR/openasr-backend-build-v1.json" \
            --provider "${{ matrix.provider }}" \
            --plugin "$PLUGIN_ASSET_PATH" \
            --vendor-archive "dist/$VENDOR_ASSET_NAME" \
            --vendor-tree "$VENDOR_DIR" \
            --vendor-extract-subdir vendor \
            --version "$OPENASR_VERSION" \
            --minimum-cli-version "$OPENASR_VERSION" \
            "${min_driver_args[@]}" \
            --base-url "https://dl.openasr.org/core/v$OPENASR_VERSION" \
            --mirror-base-url "https://github.com/QuintinShaw/openasr/releases/download/v$OPENASR_VERSION" \
            --require-single-target \
            --out "dist/${BACKEND_PACK_NAME}"
          cat "dist/${BACKEND_PACK_NAME}"

      # Bundles the plugin artifact path with the vendor archive path (cuda/
      # hip only) into one multi-line env var, so "Upload archive" below has a
      # single code path shared by every leg instead of a conditional `path:`
      # (actions/upload-artifact's glob resolution does not behave well with a
      # blank pattern line, which a naive `${{ env.X || '' }}` substitution
      # would produce on non-GPU legs).
      - name: Resolve upload paths
        shell: bash
        run: |
          set -euo pipefail
          paths="dist/openasr-${OPENASR_VERSION}-${{ matrix.asset }}.${{ matrix.archive_ext }}"
          if [ -n "${VENDOR_ASSET_NAME:-}" ] && [ "${VENDOR_OWNER:-false}" = "true" ]; then
            paths="${paths}"$'\n'"dist/${VENDOR_ASSET_NAME}"
          fi
          if [ "${{ matrix.distribution }}" = "plugin" ]; then
            paths="${paths}"$'\n'"dist/${BACKEND_PACK_NAME}"
          fi
          {
            echo "UPLOAD_PATHS<<UPLOAD_PATHS_EOF"
            echo "$paths"
            echo "UPLOAD_PATHS_EOF"
          } >> "$GITHUB_ENV"

      - name: Upload archive
        uses: actions/upload-artifact@v7
        with:
          name: openasr-${{ matrix.target }}
          path: ${{ env.UPLOAD_PATHS }}
          if-no-files-found: error

  xcframework:
    name: Build OpenASR.xcframework
    needs: [select-matrix]
    # A single-target diagnostic dispatch must consume only that platform's
    # runner. The SDK artifact belongs to complete releases, not to a Windows
    # or Linux `only_target` probe.
    if: ${{ inputs.formal_release == true }}
    # Not part of the `build` matrix above: it is a macOS/iOS SDK artifact
    # (three arch slices assembled via `xcodebuild -create-xcframework`), not
    # a CLI binary, so it gets its own job with its own toolchain/packaging
    # shape. See scripts/build-xcframework.sh and docs/SDK_IOS_MACOS.md for
    # the build itself -- this job only adds release packaging (zip + sha256)
    # around it. Mirrors (and supersedes for tagged releases) the
    # workflow_dispatch-only `xcframework` job in ci.yml, which stays for
    # ad-hoc dev-time builds off any branch; see the comment there.
    runs-on: macos-latest
    timeout-minutes: 60
    # This job only packages and uploads an immutable workflow artifact.
    # Provenance is generated centrally by `checksums` with every release
    # subject in one statement.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          ref: ${{ needs.select-matrix.outputs.source_digest }}

      - name: Resolve workspace version
        shell: bash
        run: |
          set -euo pipefail
          version="$(grep -m1 -E '^version = "' Cargo.toml | sed -E 's/^version = "([^"]+)".*/\1/')"
          if [ -z "${version}" ]; then
            echo "could not read workspace version from Cargo.toml" >&2
            exit 1
          fi
          echo "OPENASR_VERSION=${version}" >> "${GITHUB_ENV}"

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim aarch64-apple-darwin
          rustc --version
          cargo --version

      - uses: ./.github/actions/rust-cache
        id: rust-cache
        continue-on-error: true
        with:
          shared-key: release-binaries-xcframework

      - name: Report rust-cache outcome
        if: steps.rust-cache.outcome != 'success'
        shell: bash
        run: echo "::warning::rust-cache failed (outcome=${{ steps.rust-cache.outcome }}); continuing compile without cache"

      - uses: ./.github/actions/setup-cbindgen

      - name: Header drift gate
        run: scripts/generate-ffi-header.sh --check

      - name: Build xcframework (three slices)
        run: scripts/build-xcframework.sh

      - name: Package xcframework archive
        run: |
          set -euo pipefail
          archive="openasr-${OPENASR_VERSION}-xcframework"
          mkdir -p dist
          (cd target/xcframework && zip -r -X -q "${GITHUB_WORKSPACE}/dist/${archive}.zip" OpenASR.xcframework)
          (cd dist && shasum -a 256 "${archive}.zip" > "${archive}.zip.sha256")
          cat "dist/${archive}.zip.sha256"

      - name: Upload xcframework archive
        uses: actions/upload-artifact@v7
        with:
          name: openasr-xcframework
          path: |
            dist/openasr-${{ env.OPENASR_VERSION }}-xcframework.zip
            dist/openasr-${{ env.OPENASR_VERSION }}-xcframework.zip.sha256
          if-no-files-found: error

  checksums:
    name: Collect checksums
    needs: [select-matrix, build, xcframework]
    # Never assemble, attest, or upload a partial release. Experimental matrix
    # legs already express their own continue-on-error policy; every required
    # build and the complete-release xcframework must have reached its upload.
    if: ${{ !cancelled() && inputs.formal_release == true && needs.select-matrix.result == 'success' && needs.build.result == 'success' && needs.xcframework.result == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      source_digest: ${{ needs.select-matrix.outputs.source_digest }}
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    steps:
      # Checked out before generated artifacts so actions/checkout cannot
      # clean the staging/dist directories populated by later steps.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.select-matrix.outputs.source_digest }}
      - name: Download archives
        uses: actions/download-artifact@v8
        with:
          path: staging
          merge-multiple: true
      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          mkdir -p dist
          find staging -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.dll' -o -name '*.sha256' -o -name 'backend-pack-*.json' \) -exec cp {} dist/ \;
          cd dist
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Compile ABI-scoped backend catalog candidate
        if: inputs.only_target == ''
        run: |
          set -euo pipefail
          mapfile -t cuda_targets < <(python3 - <<'PY'
          import json
          from pathlib import Path

          matrix = json.loads(Path("tooling/release-manifest/release_binaries_matrix.json").read_text())
          for row in matrix:
              if row.get("provider") == "cuda" and not row.get("experimental", False):
                  print(row["cuda_gpu_target"])
          PY
          )
          mapfile -t hip_targets < <(python3 - <<'PY'
          import json
          from pathlib import Path

          matrix = json.loads(Path("tooling/release-manifest/release_binaries_matrix.json").read_text())
          for row in matrix:
              if row.get("provider") == "hip" and not row.get("experimental", False):
                  print(row["hip_gpu_target"])
          PY
          )
          if [ "${#cuda_targets[@]}" -ne 6 ] || [ "${#hip_targets[@]}" -ne 14 ]; then
            echo "release matrix must define exactly 6 CUDA SM and 14 HIP gfx targets" >&2
            exit 1
          fi
          cuda_entries=()
          for target in "${cuda_targets[@]}"; do
            entry="dist/backend-pack-cuda-sm_${target}.json"
            [ -f "$entry" ] || { echo "missing required CUDA entry: $entry" >&2; exit 1; }
            cuda_entries+=("$entry")
          done
          hip_entries=()
          for target in "${hip_targets[@]}"; do
            entry="dist/backend-pack-hip-${target}.json"
            [ -f "$entry" ] || { echo "missing required HIP entry: $entry" >&2; exit 1; }
            hip_entries+=("$entry")
          done
          vulkan_entry="dist/backend-pack-vulkan-generic.json"
          [ -f "$vulkan_entry" ] || { echo "missing required Vulkan entry: $vulkan_entry" >&2; exit 1; }
          backend_entry_args=()
          for entry in "$vulkan_entry" "${cuda_entries[@]}" "${hip_entries[@]}"; do
            backend_entry_args+=(--entry "$entry")
          done
          python3 tooling/release-manifest/backend_catalog.py merge \
            --catalog model-registry/catalog.json \
            "${backend_entry_args[@]}" \
            --out dist/catalog.backends.candidate.json
          python3 tooling/release-manifest/backend_catalog.py hints \
            "${backend_entry_args[@]}" \
            --out dist/backend-plugin-hints.json
          python3 -m json.tool dist/catalog.backends.candidate.json >/dev/null
          python3 -m json.tool dist/backend-plugin-hints.json >/dev/null
          (cd dist && sha256sum catalog.backends.candidate.json backend-plugin-hints.json >> SHA256SUMS)
      - name: Upload backend catalog candidate
        if: inputs.only_target == ''
        uses: actions/upload-artifact@v7
        with:
          name: backend-catalog-candidate
          path: |
            dist/backend-pack-cuda-sm_*.json
            dist/backend-pack-hip-gfx*.json
            dist/backend-pack-vulkan-generic.json
            dist/backend-plugin-hints.json
            dist/catalog.backends.candidate.json
          if-no-files-found: error
      # Public repositories use Sigstore's public Rekor transparency log for
      # GitHub artifact attestations. Keep that external service off the
      # expensive matrix legs: one statement binds every final release subject
      # listed in SHA256SUMS (actions/attest supports up to 1024 subjects).
      # Each action invocation already has internal network retries; these
      # bounded outer attempts cover a timeout after Rekor accepted an entry
      # but before its inclusion record was fetched. A failed third attempt
      # fails only this lightweight aggregation job, so "re-run failed jobs"
      # never recompiles CUDA/HIP.
      - name: Attest release subjects (attempt 1)
        id: attest_release_1
        continue-on-error: true
        uses: actions/attest-build-provenance@v4
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Back off before attestation retry 2
        if: steps.attest_release_1.outcome != 'success'
        shell: bash
        run: sleep 30

      - name: Attest release subjects (attempt 2)
        id: attest_release_2
        if: steps.attest_release_1.outcome != 'success'
        continue-on-error: true
        uses: actions/attest-build-provenance@v4
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Back off before attestation retry 3
        if: steps.attest_release_1.outcome != 'success' && steps.attest_release_2.outcome != 'success'
        shell: bash
        run: sleep 90

      - name: Attest release subjects (attempt 3)
        id: attest_release_3
        if: steps.attest_release_1.outcome != 'success' && steps.attest_release_2.outcome != 'success'
        uses: actions/attest-build-provenance@v4
        with:
          subject-checksums: dist/SHA256SUMS

      # `actions/attest-build-provenance` already emits the exact serialized
      # Sigstore bundle it uploaded. Preserve the successful attempt directly;
      # querying the API again with `gh attestation download` would add a second
      # network race and platform-dependent digest filenames. Qualification
      # manifests are generated only after this bundle exists because they bind
      # its exact bytes. They remain inert and unsigned here: the production
      # catalog seed never enters CI.
      - name: Compile inert backend qualification manifests
        if: inputs.only_target == ''
        env:
          ATTEST_1_OUTCOME: ${{ steps.attest_release_1.outcome }}
          ATTEST_1_BUNDLE: ${{ steps.attest_release_1.outputs.bundle-path }}
          ATTEST_2_OUTCOME: ${{ steps.attest_release_2.outcome }}
          ATTEST_2_BUNDLE: ${{ steps.attest_release_2.outputs.bundle-path }}
          ATTEST_3_OUTCOME: ${{ steps.attest_release_3.outcome }}
          ATTEST_3_BUNDLE: ${{ steps.attest_release_3.outputs.bundle-path }}
          QUALIFICATION_SOURCE_DIGEST: ${{ needs.select-matrix.outputs.source_digest }}
        run: |
          set -euo pipefail
          bundle_path=""
          for attempt in 1 2 3; do
            outcome_var="ATTEST_${attempt}_OUTCOME"
            bundle_var="ATTEST_${attempt}_BUNDLE"
            if [ "${!outcome_var:-}" = "success" ]; then
              bundle_path="${!bundle_var:-}"
              break
            fi
          done
          [ -n "$bundle_path" ] && [ -s "$bundle_path" ] || {
            echo "successful provenance attempt did not expose a non-empty bundle" >&2
            exit 1
          }
          version="$(grep -m1 -E '^version = "' Cargo.toml | sed -E 's/^version = "([^"]+)".*/\1/')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "could not resolve workspace release version" >&2
            exit 1
          }
          [[ "$QUALIFICATION_SOURCE_DIGEST" =~ ^[0-9a-f]{40}$ ]] || {
            echo "qualification source identity step did not return a commit digest" >&2
            exit 1
          }
          tag="v${version}"
          base_url="https://dl.openasr.org/core/${tag}"
          mirror_base_url="https://github.com/QuintinShaw/openasr/releases/download/${tag}"
          neutral="dist/openasr-${version}-windows-x86_64-neutral.zip"
          [ -f "$neutral" ] || { echo "missing neutral host archive: $neutral" >&2; exit 1; }
          bundle_asset="dist/openasr-${version}-build-provenance.bundle.json"
          cp -- "$bundle_path" "$bundle_asset"
          python3 -m json.tool "$bundle_asset" >/dev/null

          shopt -s nullglob
          backend_entries=(
            dist/backend-pack-cuda-sm_*.json
            dist/backend-pack-hip-gfx*.json
            dist/backend-pack-vulkan-generic.json
          )
          python3 - "${backend_entries[@]}" <<'PY'
          import json
          import sys
          from pathlib import Path

          sys.path.insert(0, "tooling/release-manifest")
          import qualification_manifest as compiler

          matrix = json.loads(Path("tooling/release-manifest/release_binaries_matrix.json").read_text())
          expected = compiler.expected_artifact_cells(matrix)
          actual = set()
          for entry_path in map(Path, sys.argv[1:]):
              entry = json.loads(entry_path.read_text(encoding="utf-8"))
              cell = compiler.artifact_cell(entry)
              if cell in actual:
                  raise SystemExit(f"duplicate exact-target backend entry: {cell}")
              actual.add(cell)
          if actual != expected:
              raise SystemExit(
                  f"qualification entries differ from release matrix: missing={sorted(expected-actual)} extra={sorted(actual-expected)}"
              )
          PY
          for entry in "${backend_entries[@]}"; do
            read -r provider target < <(python3 - "$entry" <<'PY'
          import json
          import sys
          from pathlib import Path

          sys.path.insert(0, "tooling/release-manifest")
          import qualification_manifest as compiler

          provider, target = compiler.artifact_cell(
              json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          )
          print(provider, target)
          PY
            )
            out="dist/openasr-${version}-qualification-${provider}-${target}.json"
            python3 tooling/release-manifest/qualification_manifest.py \
              --neutral-archive "$neutral" \
              --backend-entry "$entry" \
              --asset-directory dist \
              --attestation-bundle "$bundle_asset" \
              --release-subject "$tag" \
              --source-digest "$QUALIFICATION_SOURCE_DIGEST" \
              --base-url "$base_url" \
              --mirror-base-url "$mirror_base_url" \
              --out "$out"
          done

      - name: Upload inert backend qualification assets
        if: inputs.only_target == ''
        uses: actions/upload-artifact@v7
        with:
          name: backend-qualification-assets
          path: |
            dist/openasr-*-build-provenance.bundle.json
            dist/openasr-*-qualification-*.json
          if-no-files-found: error

      - name: Upload SHA256SUMS
        uses: actions/upload-artifact@v7
        with:
          name: SHA256SUMS
          path: dist/SHA256SUMS
          if-no-files-found: error

  upload-to-release:
    name: Upload assets to release
    needs: checksums
    if: ${{ !cancelled() && inputs.formal_release == true && needs.checksums.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.checksums.outputs.source_digest }}

      - name: Resolve the release tag for this ref
        id: tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "formal release ref must be one exact vX.Y.Z tag" >&2; exit 1;
          }
          tag="$RELEASE_REF"
          git fetch --force --no-tags origin "refs/tags/${tag}:refs/tags/${tag}"
          tag_commit="$(git rev-parse "${tag}^{}")"
          checkout_commit="$(git rev-parse HEAD)"
          [ "$tag_commit" = "$checkout_commit" ] || {
            echo "release tag and checked-out source commit differ" >&2; exit 1;
          }
          is_draft="$(gh release view "$tag" --repo "${{ github.repository }}" \
            --json isDraft --jq .isDraft)"
          [ "$is_draft" = "true" ] || {
            echo "formal release assets may be uploaded only to an existing draft" >&2; exit 1;
          }
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Download archives + SHA256SUMS
        uses: actions/download-artifact@v8
        with:
          path: staging
          merge-multiple: true

      - name: List what would be uploaded
        run: |
          set -euo pipefail
          echo "release: ${{ steps.tag.outputs.tag }}"
          find staging -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.dll' -o -name 'backend-pack-*.json' -o -name 'backend-plugin-hints.json' -o -name 'catalog.backends.candidate.json' -o -name 'openasr-*-build-provenance.bundle.json' -o -name 'openasr-*-qualification-*.json' -o -name '*.sha256' -o -name 'SHA256SUMS' \) -print | sort

      - name: Upload assets to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.tag.outputs.tag }}"
          if ! gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "release ${tag} does not exist yet -- release-core.yml should create it before calling this workflow" >&2
            exit 1
          fi
          is_draft="$(gh release view "$tag" --repo "${{ github.repository }}" --json isDraft --jq .isDraft)"
          [ "$is_draft" = "true" ] || {
            echo "refusing to overwrite assets on a public release" >&2
            exit 1
          }
          lock_dir="$(mktemp -d)"
          lock_token="$lock_dir/token"
          lock_acquired=false
          cleanup_lock() {
            if [ "$lock_acquired" = "true" ]; then
              scripts/qualification-release-lock.sh release "$tag" "$lock_token" || true
            fi
            rm -rf -- "$lock_dir"
          }
          trap cleanup_lock EXIT
          scripts/qualification-release-lock.sh acquire "$tag" "$lock_token"
          lock_acquired=true
          [ "$(gh release view "$tag" --repo "${{ github.repository }}" --json isDraft --jq .isDraft)" = "true" ] || {
            echo "release stopped being a draft while acquiring the qualification lock" >&2
            exit 1
          }
          existing_signatures="$(gh release view "$tag" --repo "${{ github.repository }}" --json assets \
            --jq '.assets[].name | select(contains("-qualification-") and endswith(".signature.json"))')"
          [ -z "$existing_signatures" ] || {
            echo "refusing to replace qualification manifests while detached signatures exist:" >&2
            echo "$existing_signatures" >&2
            echo "remove/revoke those signatures explicitly, rebuild the inert bytes, then rerun local signing" >&2
            exit 1
          }
          # nullglob drops optional unmatched artifact patterns instead of
          # passing them to `gh` as literal paths.
          shopt -s nullglob
          assets=(staging/*.tar.gz staging/*.zip staging/*.dll staging/backend-pack-*.json staging/backend-plugin-hints.json staging/catalog.backends.candidate.json staging/openasr-*-build-provenance.bundle.json staging/openasr-*-qualification-*.json staging/*.sha256 staging/SHA256SUMS)
          # --clobber so a re-run (retrying a flaky leg) replaces stale assets
          # instead of failing on "asset already exists".
          [ "$(gh release view "$tag" --repo "${{ github.repository }}" --json isDraft --jq .isDraft)" = "true" ] || {
            echo "release stopped being a draft before asset upload" >&2
            exit 1
          }
          gh release upload "$tag" "${assets[@]}" \
            --repo "${{ github.repository }}" --clobber
          scripts/qualification-release-lock.sh release "$tag" "$lock_token"
          lock_acquired=false

  verify-completeness:
    name: Verify release completeness
    needs: [checksums, upload-to-release]
    if: ${{ always() && !cancelled() && inputs.formal_release == true && needs.checksums.result == 'success' && needs.upload-to-release.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.upload-to-release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.checksums.outputs.source_digest }}

      - name: Resolve workspace version
        run: |
          set -euo pipefail
          version="$(grep -m1 -E '^version = "' Cargo.toml | sed -E 's/^version = "([^"]+)".*/\1/')"
          echo "OPENASR_VERSION=${version}" >> "${GITHUB_ENV}"

      - name: Assert the release has every expected matrix asset
        # Keep this TARGETS list (friendly asset names, matching each matrix
        # leg's `asset:` field) in sync with jobs.build.strategy.matrix.include
        # above, plus jobs.xcframework's asset -- this is the release-integrity
        # gate: a release "shipped" but missing a platform's archive (e.g. one
        # matrix leg failed and `checksums` silently dropped it, per its
        # `!cancelled()` condition)
        # must fail loudly here instead of quietly shipping partial coverage.
        # `experimental: true` legs (e.g. windows-arm64) are deliberately NOT
        # listed: they may fail without failing the run, so requiring their
        # asset here would defeat the escape hatch. Promote such a leg (drop
        # `experimental`, add its asset:ext here) once it proves green.
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG}"
          [ -n "$tag" ] || { echo "release tag is empty" >&2; exit 1; }
          version="${OPENASR_VERSION}"

          TARGETS=(
            "linux-x86_64:tar.gz"
            "linux-arm64:tar.gz"
            "macos-x86_64:tar.gz"
            "macos-arm64:tar.gz"
            "windows-x86_64:zip"
            "windows-x86_64-neutral:zip"
            "linux-x86_64-vulkan:tar.gz"
            "linux-x86_64-cuda:tar.gz"
            "linux-x86_64-rocm:tar.gz"
            # Not a CLI binary leg (see jobs.xcframework above), but still a
            # released, version-named asset -- keep it in this same
            # completeness gate so a broken xcframework build fails loudly
            # instead of quietly shipping a release without the SDK.
            "xcframework:zip"
          )

          expected_file="$(mktemp)"
          base_expected="$(mktemp)"
          {
            for entry in "${TARGETS[@]}"; do
              target="${entry%%:*}"
              ext="${entry##*:}"
              echo "openasr-${version}-${target}.${ext}"
            done
            echo "openasr-${version}-xcframework.zip.sha256"
          } > "$base_expected"
          pack_names="$(mktemp)"
          python3 - "$pack_names" <<'PY'
          import json
          import sys
          from pathlib import Path

          matrix = json.loads(Path("tooling/release-manifest/release_binaries_matrix.json").read_text())
          names = []
          for row in matrix:
              provider = row.get("provider")
              if provider == "cuda" and not row.get("experimental", False):
                  names.append(f"backend-pack-cuda-sm_{row['cuda_gpu_target']}.json")
              elif provider == "hip" and not row.get("experimental", False):
                  names.append(f"backend-pack-hip-{row['hip_gpu_target']}.json")
              elif provider == "vulkan" and row.get("distribution") == "plugin":
                  names.append("backend-pack-vulkan-generic.json")
          Path(sys.argv[1]).write_text("\n".join(names) + "\n", encoding="utf-8")
          PY
          pack_dir="$(mktemp -d)"
          while IFS= read -r pack_name; do
            [ -n "$pack_name" ] || continue
            gh release download "$tag" --repo "${{ github.repository }}" \
              -p "$pack_name" -D "$pack_dir"
          done < "$pack_names"
          pack_payload_names="$(mktemp)"
          python3 - "$pack_dir" "$version" > "$pack_payload_names" <<'PY'
          import json
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          version = sys.argv[2]
          for entry_path in sorted(root.glob("backend-pack-*.json")):
              entry = json.loads(entry_path.read_text(encoding="utf-8"))
              provider = entry.get("vendor")
              targets = entry.get("targets")
              if provider not in {"cuda", "hip"} or not isinstance(targets, list) or len(targets) != 1:
                  raise SystemExit(f"{entry_path.name} is not an exact CUDA/HIP target entry")
              print(f"openasr-{version}-qualification-{provider}-{targets[0]}.json")
              files = entry.get("files")
              if not isinstance(files, list) or not files:
                  raise SystemExit(f"{entry_path.name} has no files")
              for file in files:
                  name = file.get("filename") if isinstance(file, dict) else None
                  if not isinstance(name, str) or not name or Path(name).name != name:
                      raise SystemExit(f"{entry_path.name} has unsafe filename {name!r}")
                  print(name)
          PY
          {
            cat "$base_expected"
            cat "$pack_names"
            cat "$pack_payload_names"
            echo "backend-plugin-hints.json"
            echo "catalog.backends.candidate.json"
            echo "openasr-${version}-build-provenance.bundle.json"
            echo "openasr-${version}-qualification-vulkan-windows-x86_64.json"
            echo "SHA256SUMS"
          } > "$expected_file"
          sort -u -o "$expected_file" "$expected_file"

          actual_file="$(mktemp)"
          gh release view "$tag" --repo "${{ github.repository }}" --json assets \
            --jq '.assets[].name' | sort > "$actual_file"
          lock_asset="openasr-${version}-qualification-mutation.lock"
          if grep -Fqx "$lock_asset" "$actual_file"; then
            echo "::error::release ${tag} still has qualification mutation lock ${lock_asset}" >&2
            exit 1
          fi

          echo "== expected =="
          cat "$expected_file"
          echo "== actual =="
          cat "$actual_file"

          missing="$(comm -23 "$expected_file" "$actual_file")"
          extra="$(comm -13 "$expected_file" "$actual_file")"
          if [ -n "$missing" ]; then
            echo "::error::release ${tag} is missing expected asset(s):"
            echo "$missing"
            exit 1
          fi
          if [ -n "$extra" ]; then
            echo "::error::release ${tag} contains unexpected asset(s):"
            echo "$extra"
            exit 1
          fi
          echo "release ${tag} has all $(wc -l < "$expected_file" | tr -d ' ') expected assets."

          echo "release ${tag} has every plugin and content-addressed vendor archive declared by its required backend packs."
