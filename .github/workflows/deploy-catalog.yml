name: Deploy catalog

# Deploys the signed PUBLIC catalog projection only as a reusable stage of the
# release orchestrator. It never deploys because a catalog file changed on main;
# the caller supplies immutable candidate catalog and correctness artifacts.
#
# `gate-released-binary-compat` runs BEFORE `deploy` (see `needs:` below): catalog
# data and CLI binaries ship on independent cadences, so a catalog edit that is
# fine for the binary being cut right now can still hit an already-shipped,
# already-in-the-wild binary in a way nothing else in CI ever checks. That job
# downloads the latest *stable* CLI release and runs `openasr doctor` against the
# candidate catalog before it goes live -- see scripts/gate-catalog-against-released-binary.sh
# for the full mechanism and rationale. Its notion of "the latest released binary"
# is a moving target by design: whichever vX.Y.Z is GitHub's current `latest`
# release for this repo when the workflow runs is what gets tested. That is
# intentional -- once a CLI release ships that is forward-compatible with a given
# catalog shape, this gate should (and will, automatically, with no edits here)
# start passing that catalog again.
on:
  # Catalog deployment is a release-orchestrator stage, never a direct main-push
  # side effect. The caller must provide the immutable candidate artifacts and
  # correctness evidence; the finalizer invokes this only after the gate passes.
  workflow_call:
    inputs:
      activation_transition:
        description: "published-inert, activated, or fail-safe revoked"
        required: true
        type: string
      backend_id:
        description: "Exact backend id for an activated transition"
        required: false
        type: string
      qualification_run_ids:
        description: "Space-separated trusted qualification run ids"
        required: false
        type: string
      orchestrator_run_id:
        required: true
        type: string
      release_tag:
        required: true
        type: string
    outputs:
      binding_deploy_run_id:
        description: "Successful deploy run identity consumed by the finalizer"
        value: ${{ jobs.deploy.outputs.binding_deploy_run_id }}
      deployed_catalog_sha256:
        description: "SHA-256 of the catalog bytes actually deployed"
        value: ${{ jobs.deploy.outputs.deployed_catalog_sha256 }}
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      ALIBABA_CLOUD_ACCESS_KEY_ID:
        required: false
      ALIBABA_CLOUD_ACCESS_KEY_SECRET:
        required: false
concurrency:
  group: deploy-catalog
  cancel-in-progress: false

permissions:
  actions: read
  attestations: read
  contents: read

jobs:
  gate-activation:
    name: Verify release-bound catalog activation state
    if: github.repository == 'QuintinShaw/openasr'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify PublishedInert state against exact release entries
        if: inputs.activation_transition == 'published-inert'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          activation_catalog="model-registry/catalog.public.json"
          [ -f "$activation_catalog" ] || { echo "committed public catalog is missing" >&2; exit 1; }
          version="${{ inputs.release_tag }}"; version="${version#v}"
          mkdir -p staging/release
          gh release download "${{ inputs.release_tag }}" -p 'backend-pack-*.json' -D staging/release
          mapfile -t entries < <(find staging/release -name 'backend-pack-*.json' -type f | sort)
          [ "${#entries[@]}" -eq 21 ] || {
            echo "expected 21 exact release backend entries, found ${#entries[@]}" >&2; exit 1;
          }
          entry_args=(); for item in "${entries[@]}"; do entry_args+=(--entry "$item"); done
          python3 tooling/release-manifest/backend_catalog.py verify-catalog \
            --catalog "$activation_catalog" "${entry_args[@]}"
          python3 tooling/release-manifest/backend_hardware_evidence.py \
            "${entry_args[@]}" --catalog "$activation_catalog" --version "$version"

      - name: Replay and verify Qualified to Activated from attested evidence
        if: inputs.activation_transition == 'activated'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          BACKEND_ID: ${{ inputs.backend_id }}
          QUALIFICATION_RUN_IDS: ${{ inputs.qualification_run_ids }}
        run: |
          set -euo pipefail
          [ "${GITHUB_REF}" = "refs/heads/main" ] || {
            echo "activated catalog deployment may run only from protected main" >&2; exit 1;
          }
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$BACKEND_ID" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,255}$ ]]
          read -r -a run_ids <<< "$QUALIFICATION_RUN_IDS"
          [ "${#run_ids[@]}" -gt 0 ] || { echo "activation requires qualification run ids" >&2; exit 1; }
          git fetch --force --no-tags origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          tag_commit="$(git rev-parse "${RELEASE_TAG}^{}")"
          [[ "$tag_commit" =~ ^[0-9a-f]{40}$ ]]
          release_json="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease,tagName,publishedAt)"
          python3 - "$release_json" "$RELEASE_TAG" <<'PY'
          import json, sys
          value = json.loads(sys.argv[1])
          if (value.get("isDraft") or value.get("isPrerelease")
                  or value.get("tagName") != sys.argv[2]
                  or not value.get("publishedAt")):
              raise SystemExit("activation requires an already-public stable release")
          PY
          workdir="${RUNNER_TEMP}/activation-evidence"
          mkdir -p "$workdir/runs" "$workdir/release"
          for run_id in "${run_ids[@]}"; do
            [[ "$run_id" =~ ^[1-9][0-9]*$ ]]
            gh run view "$run_id" --repo "$GITHUB_REPOSITORY" \
              --json workflowName,conclusion,headSha > "$workdir/run-$run_id.json"
            python3 - "$workdir/run-$run_id.json" "$tag_commit" <<'PY'
          import json, sys
          value = json.load(open(sys.argv[1], encoding="utf-8"))
          assert value.get("workflowName") == "Qualify Windows backend"
          assert value.get("conclusion") == "success"
          assert value.get("headSha") == sys.argv[2]
          PY
            gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
              --dir "$workdir/runs/$run_id"
          done

          find_one() {
            local root="$1" pattern="$2"
            mapfile -t paths < <(find "$root" -type f -name "$pattern" -print | sort)
            [ "${#paths[@]}" -eq 1 ] || { echo "expected one $pattern under $root" >&2; exit 1; }
            printf '%s\n' "${paths[0]}"
          }
          first_root="$workdir/runs/${run_ids[0]}"
          matrix="$(find_one "$first_root" 'gpu-correctness-matrix.v1.json')"
          inventory="$(find_one "$first_root" 'gpu-correctness-source-inventory.json')"
          models="$(find_one "$first_root" 'gpu-correctness-source-model-catalog.json')"
          backends="$(find_one "$first_root" 'gpu-correctness-source-backend-catalog.json')"
          hardware_evidence="$(find_one "$first_root" 'backend-hardware-evidence-*.json')"
          hardware_raw="$(find_one "$first_root" 'backend-hardware-audit-*.json')"
          receipts=(); traces=()
          for run_id in "${run_ids[@]}"; do
            root="$workdir/runs/$run_id"
            for name in gpu-correctness-matrix.v1.json gpu-correctness-source-inventory.json gpu-correctness-source-model-catalog.json gpu-correctness-source-backend-catalog.json; do
              cmp -s "$(find_one "$root" "$name")" "$(find_one "$first_root" "$name")" || {
                echo "qualification runs disagree on $name" >&2; exit 1;
              }
            done
            mapfile -t run_receipts < <(find "$root" -type f -name 'gpu-correctness-receipt-*.json' -print | sort)
            mapfile -t run_traces < <(find "$root" -type f -name 'gpu-correctness-trace-*.jsonl' -print | sort)
            receipts+=("${run_receipts[@]}"); traces+=("${run_traces[@]}")
          done
          [ "${#receipts[@]}" -ge 4 ] && [ "${#traces[@]}" -ge 2 ]

          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            -p 'backend-pack-*.json' -p SHA256SUMS -D "$workdir/release"
          mapfile -t entries < <(find "$workdir/release" -type f -name 'backend-pack-*.json' -print | sort)
          [ "${#entries[@]}" -eq 21 ]
          python3 - "$hardware_raw" > "$workdir/subject-names.txt" <<'PY'
          import json, pathlib, sys
          raw = json.load(open(sys.argv[1], encoding="utf-8"))
          names = set()
          for item in raw.get("attested_release_subjects", []):
              name = item.get("filename") if isinstance(item, dict) else None
              assert isinstance(name, str) and pathlib.Path(name).name == name
              names.add(name)
          print("\n".join(sorted(names)))
          PY
          while IFS= read -r name; do
            [ -n "$name" ] && gh release download "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" -p "$name" -D "$workdir/release" --clobber
          done < "$workdir/subject-names.txt"
          entry_args=(); for path in "${entries[@]}"; do entry_args+=(--entry "$path"); done
          subject_args=(); while IFS= read -r name; do [ -n "$name" ] && subject_args+=(--release-subject "$workdir/release/$name"); done < "$workdir/subject-names.txt"
          release_signer="${GITHUB_REPOSITORY}/.github/workflows/release-binaries.yml"
          qualification_signer="${GITHUB_REPOSITORY}/.github/workflows/qualify-windows-backend.yml"
          python3 tooling/release-manifest/backend_hardware_evidence.py \
            "${entry_args[@]}" --evidence "$hardware_evidence" --raw-audit "$hardware_raw" \
            "${subject_args[@]}" --checksums "$workdir/release/SHA256SUMS" \
            --repo "$GITHUB_REPOSITORY" --signer-workflow "$release_signer" \
            --qualification-signer-workflow "$qualification_signer" --source-digest "$tag_commit"

          python3 tooling/publish-model/scripts/check_catalog_consistency.py \
            --catalog-pair model-registry/catalog.public.json \
            model-registry/catalog.public.signature.json
          curl -fsSL "https://catalog.openasr.org/v1/catalog.json?before-activation=${GITHUB_RUN_ID}" \
            -o "$workdir/current-catalog.json"
          curl -fsSL "https://catalog.openasr.org/v1/catalog.signature.json?before-activation=${GITHUB_RUN_ID}" \
            -o "$workdir/current-catalog.signature.json"
          python3 tooling/publish-model/scripts/check_catalog_consistency.py \
            --catalog-pair "$workdir/current-catalog.json" \
            "$workdir/current-catalog.signature.json"
          receipt_args=(); for path in "${receipts[@]}"; do receipt_args+=(--receipt "$path"); done
          trace_args=(); for path in "${traces[@]}"; do trace_args+=(--trace "$path"); done
          python3 tooling/release-manifest/gpu_correctness_gate.py verify-catalog-transition \
            --manifest "$matrix" --inventory "$inventory" --catalog "$models" \
            --backend-catalog "$backends" --current-activation-catalog "$workdir/current-catalog.json" \
            --candidate-activation-catalog model-registry/catalog.public.json \
            --backend-id "$BACKEND_ID" "${entry_args[@]}" \
            --hardware-evidence "$hardware_evidence" --hardware-raw-audit "$hardware_raw" \
            "${receipt_args[@]}" "${trace_args[@]}" \
            --evidence-repo "$GITHUB_REPOSITORY" \
            --evidence-signer-workflow "$qualification_signer" \
            --evidence-source-digest "$tag_commit"

      - name: Replay and verify exact fail-safe revocation
        if: inputs.activation_transition == 'revoked'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          BACKEND_ID: ${{ inputs.backend_id }}
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = "refs/heads/main" ] || {
            echo "revoked catalog deployment may run only from protected main" >&2; exit 1;
          }
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$BACKEND_ID" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,255}$ ]]
          release_json="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease,tagName,publishedAt)"
          python3 - "$release_json" "$RELEASE_TAG" <<'PY'
          import json, sys
          value = json.loads(sys.argv[1])
          if (value.get("isDraft") or value.get("isPrerelease")
                  or value.get("tagName") != sys.argv[2]
                  or not value.get("publishedAt")):
              raise SystemExit("revocation requires an already-public stable release")
          PY
          version="${RELEASE_TAG#v}"
          python3 - model-registry/catalog.public.json "$BACKEND_ID" "$version" <<'PY'
          import json, sys
          catalog = json.load(open(sys.argv[1], encoding="utf-8"))
          matches = [item for item in catalog.get("backends", []) if item.get("id") == sys.argv[2]]
          if len(matches) != 1 or str(matches[0].get("version")) != sys.argv[3]:
              raise SystemExit("revoked backend does not belong to the authorized release")
          PY
          workdir="${RUNNER_TEMP}/revocation-evidence"
          mkdir -p "$workdir"
          curl -fsSL "https://catalog.openasr.org/v1/catalog.json?before-revocation=${GITHUB_RUN_ID}" \
            -o "$workdir/current-catalog.json"
          curl -fsSL "https://catalog.openasr.org/v1/catalog.signature.json?before-revocation=${GITHUB_RUN_ID}" \
            -o "$workdir/current-catalog.signature.json"
          python3 tooling/publish-model/scripts/check_catalog_consistency.py \
            --catalog-pair "$workdir/current-catalog.json" \
            "$workdir/current-catalog.signature.json"
          python3 tooling/publish-model/scripts/check_catalog_consistency.py \
            --catalog-pair model-registry/catalog.public.json \
            model-registry/catalog.public.signature.json
          python3 tooling/release-manifest/gpu_correctness_gate.py \
            verify-revocation-transition \
            --current-activation-catalog "$workdir/current-catalog.json" \
            --candidate-activation-catalog model-registry/catalog.public.json \
            --backend-id "$BACKEND_ID"

      - name: Reject unknown activation transition
        if: inputs.activation_transition != 'published-inert' && inputs.activation_transition != 'activated' && inputs.activation_transition != 'revoked'
        run: |
          echo "unsupported activation_transition=${{ inputs.activation_transition }}" >&2
          exit 1

  gate-released-binary-compat:
    # Same repo scope as `deploy`: this reads public GitHub releases only (no
    # secrets needed), but it exists to guard this repo's production deploy,
    # not to run speculatively on forks.
    if: github.repository == 'QuintinShaw/openasr'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify candidate public catalog contents
        run: |
          set -euo pipefail
          python3 tooling/publish-model/scripts/check_catalog_consistency.py
          catalog="model-registry/catalog.public.json"
          signature="model-registry/catalog.public.signature.json"
          test -f "$catalog" -a -f "$signature"
          sha256sum "$catalog" "$signature"
          python3 - "$catalog" "$signature" <<'PY'
          import hashlib, json, pathlib, sys
          raw = pathlib.Path(sys.argv[1]).read_bytes()
          sig = json.loads(pathlib.Path(sys.argv[2]).read_text())
          catalog = json.loads(raw)
          assert hashlib.sha256(raw).hexdigest() == sig["catalog_sha256"]
          assert sig["catalog_url"] == "https://catalog.openasr.org/v1/catalog.json"
          assert catalog.get("models") and all(item.get("public") is True for item in catalog["models"])
          PY

      - name: Gate candidate catalog against the latest released CLI binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          catalog="model-registry/catalog.public.json"
          signature="model-registry/catalog.public.signature.json"
          scripts/gate-catalog-against-released-binary.sh "$catalog" "$signature"

  deploy:
    needs: [gate-activation, gate-released-binary-compat]
    # Forks should never attempt to deploy to the maintainer's Cloudflare
    # account (and would fail anyway without CLOUDFLARE_API_TOKEN).
    if: github.repository == 'QuintinShaw/openasr'
    outputs:
      binding_deploy_run_id: ${{ steps.binding.outputs.deploy_run_id }}
      deployed_catalog_sha256: ${{ steps.binding.outputs.catalog_sha256 }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify candidate public catalog
        run: |
          set -euo pipefail
          python3 tooling/publish-model/scripts/check_catalog_consistency.py
          catalog="model-registry/catalog.public.json"
          signature="model-registry/catalog.public.signature.json"
          test -f "$catalog" -a -f "$signature"
          cp "$catalog" candidate-catalog.json
          cp "$signature" candidate-catalog.signature.json
          python3 - <<'PY'
          import hashlib, json
          raw = open("candidate-catalog.json", "rb").read()
          sig = json.load(open("candidate-catalog.signature.json"))
          catalog = json.loads(raw)
          assert hashlib.sha256(raw).hexdigest() == sig["catalog_sha256"], "catalog.public.json sha256 != signature.catalog_sha256"
          assert sig["catalog_url"] == "https://catalog.openasr.org/v1/catalog.json", "catalog_url is not the canonical signed identity"
          assert catalog.get("models"), "public catalog has no models"
          assert all(m.get("public") is True for m in catalog["models"]), "public catalog must contain only public:true models"
          print(f"OK: {len(catalog['models'])} public model(s); sha256 + canonical url consistent")
          PY

      - name: Verify signed backend payloads are live before metadata deployment
        run: |
          python3 tooling/release-manifest/backend_catalog.py verify-cdn \
            --catalog candidate-catalog.json

      - name: Emit deploy binding outputs
        id: binding
        run: |
          set -euo pipefail
          {
            echo "deploy_run_id=${GITHUB_RUN_ID}"
            echo "caller_run_id=${{ inputs.orchestrator_run_id }}"
            echo "workflow_name=Deploy catalog"
            echo "catalog_sha256=$(sha256sum candidate-catalog.json | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Pin wrangler 4.x: the action's default (3.90.0) cannot read this
          # wrangler.jsonc (4.x `assets`/`run_worker_first` + JSONC comments) and
          # fails with "Missing entry-point".
          wranglerVersion: "4.98.0"
          workingDirectory: cloudflare/catalog
          # Stage the committed signed bytes as the served static assets, then deploy.
          preCommands: |
            mkdir -p public
            cp ../../candidate-catalog.json public/catalog.json
            cp ../../candidate-catalog.signature.json public/catalog.signature.json
          command: deploy

      - name: Verify live endpoint serves the committed public projection
        run: |
          # The edge cache and asset propagation lag the deploy by up to ~a
          # minute: retry with a cache-busting query (distinct cache key, so
          # the read goes to origin) instead of failing on the first stale hit.
          base="https://catalog.openasr.org/v1"
          for attempt in $(seq 1 12); do
            bust="cb=${GITHUB_SHA}-${attempt}"
            curl -fsSL "$base/catalog.json?$bust" -o /tmp/live-catalog.json
            curl -fsSL "$base/catalog.signature.json?$bust" -o /tmp/live-catalog.sig.json
            if cmp -s /tmp/live-catalog.json candidate-catalog.json \
              && cmp -s /tmp/live-catalog.sig.json candidate-catalog.signature.json; then
              break
            fi
            if [ "$attempt" = "12" ]; then
              echo "::error::live catalog still differs from the committed public projection after $attempt attempts"
              cmp /tmp/live-catalog.json candidate-catalog.json || true
              cmp /tmp/live-catalog.sig.json candidate-catalog.signature.json || true
              exit 1
            fi
            echo "live catalog not yet consistent (attempt $attempt); retrying in 10s"
            sleep 10
          done
          if grep -q '"public": false' /tmp/live-catalog.json; then
            echo "::error::live catalog exposes public:false entries"; exit 1
          fi
          echo "live catalog.openasr.org matches the committed public projection (public-only)"

      - name: Deploy identical bytes to Aliyun ESA (catalog.bug.im)
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        run: |
          set -euo pipefail
          if [ -n "${ALIBABA_CLOUD_ACCESS_KEY_ID:-}" ] && [ -n "${ALIBABA_CLOUD_ACCESS_KEY_SECRET:-}" ]; then
            npm install -g esa-cli
          fi
          chmod +x scripts/deploy-catalog-esa.sh
          # Skip (exit 0) when esa-cli is missing, not logged in, or live HTTPS
          # is unreachable. Reachable catalog.bug.im with a sha256 mismatch
          # fails the job.
          scripts/deploy-catalog-esa.sh candidate-catalog.json candidate-catalog.signature.json

      - name: Record immutable deploy binding
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          ACTIVATION_TRANSITION: ${{ inputs.activation_transition }}
          BACKEND_ID: ${{ inputs.backend_id }}
          ORCHESTRATOR_RUN_ID: ${{ inputs.orchestrator_run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          def sha256(path: str) -> str:
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          run_id = os.environ["GITHUB_RUN_ID"]
          orchestrator = os.environ["ORCHESTRATOR_RUN_ID"]
          if orchestrator != run_id:
              raise SystemExit("deploy binding does not belong to its orchestrator run")
          binding = {
              "schema_version": 1,
              "release_tag": os.environ["RELEASE_TAG"],
              "activation_transition": os.environ["ACTIVATION_TRANSITION"],
              "backend_id": os.environ.get("BACKEND_ID", ""),
              "orchestrator_run_id": orchestrator,
              "deploy_run_id": run_id,
              "source_commit": os.environ["GITHUB_SHA"],
              "catalog_sha256": sha256("candidate-catalog.json"),
              "catalog_signature_sha256": sha256("candidate-catalog.signature.json"),
          }
          Path("deploy-catalog-binding.json").write_text(
              json.dumps(binding, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload immutable deploy binding
        uses: actions/upload-artifact@v7
        with:
          name: deploy-catalog-binding-${{ github.run_id }}
          path: deploy-catalog-binding.json
          if-no-files-found: error
          retention-days: 30
