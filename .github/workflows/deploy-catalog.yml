name: Deploy catalog

# Deploys the signed PUBLIC catalog projection only as a reusable stage of the
# release orchestrator. It never deploys because a catalog file changed on main;
# the caller supplies immutable candidate catalog and correctness artifacts.
#
# `gate-released-binary-compat` runs BEFORE `deploy` (see `needs:` below): catalog
# data and CLI binaries ship on independent cadences, so a catalog edit that is
# fine for the binary being cut right now can still hit an already-shipped,
# already-in-the-wild binary in a way nothing else in CI ever checks. That job
# downloads the latest *stable* CLI release and runs `openasr doctor` against the
# candidate catalog before it goes live -- see scripts/gate-catalog-against-released-binary.sh
# for the full mechanism and rationale. Its notion of "the latest released binary"
# is a moving target by design: whichever vX.Y.Z is GitHub's current `latest`
# release for this repo when the workflow runs is what gets tested. That is
# intentional -- once a CLI release ships that is forward-compatible with a given
# catalog shape, this gate should (and will, automatically, with no edits here)
# start passing that catalog again.
on:
  # Catalog deployment is a release-orchestrator stage, never a direct main-push
  # side effect. The caller must provide the immutable candidate artifacts and
  # correctness evidence; the finalizer invokes this only after the gate passes.
  workflow_call:
    inputs:
      correctness_artifact:
        required: true
        type: string
      correctness_sources_artifact:
        required: true
        type: string
      correctness_traces_artifact:
        required: true
        type: string
      public_catalog_artifact:
        required: true
        type: string
      public_catalog_signature_artifact:
        required: true
        type: string
      orchestrator_run_id:
        required: true
        type: string
      release_tag:
        required: true
        type: string
    outputs:
      binding_deploy_run_id:
        description: "Successful deploy run identity consumed by the finalizer"
        value: ${{ jobs.deploy.outputs.binding_deploy_run_id }}
      deployed_catalog_sha256:
        description: "SHA-256 of the catalog bytes actually deployed"
        value: ${{ jobs.deploy.outputs.deployed_catalog_sha256 }}
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
concurrency:
  group: deploy-catalog
  cancel-in-progress: false

jobs:
  gate-correctness:
    name: Verify immutable correctness matrix and receipts
    if: github.repository == 'QuintinShaw/openasr'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download staged correctness artifacts
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.correctness_artifact }}
          path: staging/correctness
      - name: Download canonical source snapshots
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.correctness_sources_artifact }}
          path: staging/sources
      - name: Download immutable trace artifacts
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.correctness_traces_artifact }}
          path: staging/traces
      - name: Verify matrix, source digests, artifact bindings, and trace contents
        run: |
          set -euo pipefail
          matrix="$(find staging/correctness -name 'gpu-correctness-matrix.v1.json' -type f -print -quit)"
          inventory="$(find staging/sources -name 'gpu-correctness-source-inventory.json' -type f -print -quit)"
          catalog="$(find staging/sources -name 'gpu-correctness-source-model-catalog.json' -type f -print -quit)"
          backends="$(find staging/sources -name 'gpu-correctness-source-backend-catalog.json' -type f -print -quit)"
          test -n "$matrix" -a -n "$inventory" -a -n "$catalog" -a -n "$backends"
          mapfile -t receipts < <(find staging/correctness -name 'gpu-correctness-receipt-*.json' -type f | sort)
          mapfile -t traces < <(find staging/traces -type f -name 'gpu-correctness-trace-*.jsonl' | sort)
          test "${#receipts[@]}" -gt 0
          test "${#traces[@]}" -gt 0
          receipt_args=(); for item in "${receipts[@]}"; do receipt_args+=(--receipt "$item"); done
          trace_args=(); for item in "${traces[@]}"; do trace_args+=(--trace "$item"); done
          python3 tooling/release-manifest/gpu_correctness_gate.py validate \
            --manifest "$matrix" --inventory "$inventory" --catalog "$catalog" \
            --backend-catalog "$backends" "${receipt_args[@]}" "${trace_args[@]}"

  gate-released-binary-compat:
    # Same repo scope as `deploy`: this reads public GitHub releases only (no
    # secrets needed), but it exists to guard this repo's production deploy,
    # not to run speculatively on forks.
    if: github.repository == 'QuintinShaw/openasr'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.public_catalog_artifact }}
          path: staging/public
      - uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.public_catalog_signature_artifact }}
          path: staging/public
      - name: Verify candidate public catalog contents
        run: |
          set -euo pipefail
          catalog="$(find staging/public -name catalog.json -type f -print -quit)"
          signature="$(find staging/public -name catalog.signature.json -type f -print -quit)"
          test -n "$catalog" -a -n "$signature"
          sha256sum "$catalog" "$signature"
          python3 - "$catalog" "$signature" <<'PY'
          import hashlib, json, pathlib, sys
          raw = pathlib.Path(sys.argv[1]).read_bytes()
          sig = json.loads(pathlib.Path(sys.argv[2]).read_text())
          catalog = json.loads(raw)
          assert hashlib.sha256(raw).hexdigest() == sig["catalog_sha256"]
          assert sig["catalog_url"] == "https://catalog.openasr.org/v1/catalog.json"
          assert catalog.get("models") and all(item.get("public") is True for item in catalog["models"])
          PY

      - name: Gate candidate catalog against the latest released CLI binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          catalog="$(find staging/public -name catalog.json -type f -print -quit)"
          signature="$(find staging/public -name catalog.signature.json -type f -print -quit)"
          scripts/gate-catalog-against-released-binary.sh "$catalog" "$signature"

  deploy:
    needs: [gate-correctness, gate-released-binary-compat]
    # Forks should never attempt to deploy to the maintainer's Cloudflare
    # account (and would fail anyway without CLOUDFLARE_API_TOKEN).
    if: github.repository == 'QuintinShaw/openasr'
    outputs:
      binding_deploy_run_id: ${{ steps.binding.outputs.deploy_run_id }}
      deployed_catalog_sha256: ${{ steps.binding.outputs.catalog_sha256 }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.public_catalog_artifact }}
          path: staging/public
      - uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.public_catalog_signature_artifact }}
          path: staging/public
      - name: Verify candidate public catalog
        run: |
          set -euo pipefail
          catalog="$(find staging/public -name catalog.json -type f -print -quit)"
          signature="$(find staging/public -name catalog.signature.json -type f -print -quit)"
          test -n "$catalog" -a -n "$signature"
          cp "$catalog" candidate-catalog.json
          cp "$signature" candidate-catalog.signature.json
          python3 - <<'PY'
          import hashlib, json
          raw = open("candidate-catalog.json", "rb").read()
          sig = json.load(open("candidate-catalog.signature.json"))
          catalog = json.loads(raw)
          assert hashlib.sha256(raw).hexdigest() == sig["catalog_sha256"], "catalog.public.json sha256 != signature.catalog_sha256"
          assert sig["catalog_url"] == "https://catalog.openasr.org/v1/catalog.json", "catalog_url is not the canonical signed identity"
          assert catalog.get("models"), "public catalog has no models"
          assert all(m.get("public") is True for m in catalog["models"]), "public catalog must contain only public:true models"
          print(f"OK: {len(catalog['models'])} public model(s); sha256 + canonical url consistent")
          PY

      - name: Verify signed backend payloads are live before metadata deployment
        run: |
          python3 tooling/release-manifest/backend_catalog.py verify-cdn \
            --catalog candidate-catalog.json

      - name: Emit deploy binding outputs
        id: binding
        run: |
          set -euo pipefail
          echo "deploy_run_id=${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"
          echo "caller_run_id=${{ inputs.orchestrator_run_id }}" >> "$GITHUB_OUTPUT"
          echo "workflow_name=Deploy catalog" >> "$GITHUB_OUTPUT"
          echo "catalog_sha256=$(sha256sum candidate-catalog.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Pin wrangler 4.x: the action's default (3.90.0) cannot read this
          # wrangler.jsonc (4.x `assets`/`run_worker_first` + JSONC comments) and
          # fails with "Missing entry-point".
          wranglerVersion: "4.98.0"
          workingDirectory: cloudflare/catalog
          # Stage the committed signed bytes as the served static assets, then deploy.
          preCommands: |
            mkdir -p public
            cp ../../candidate-catalog.json public/catalog.json
            cp ../../candidate-catalog.signature.json public/catalog.signature.json
          command: deploy

      - name: Verify live endpoint serves the committed public projection
        run: |
          # The edge cache and asset propagation lag the deploy by up to ~a
          # minute: retry with a cache-busting query (distinct cache key, so
          # the read goes to origin) instead of failing on the first stale hit.
          base="https://catalog.openasr.org/v1"
          for attempt in $(seq 1 12); do
            bust="cb=${GITHUB_SHA}-${attempt}"
            curl -fsSL "$base/catalog.json?$bust" -o /tmp/live-catalog.json
            curl -fsSL "$base/catalog.signature.json?$bust" -o /tmp/live-catalog.sig.json
            if cmp -s /tmp/live-catalog.json candidate-catalog.json \
              && cmp -s /tmp/live-catalog.sig.json candidate-catalog.signature.json; then
              break
            fi
            if [ "$attempt" = "12" ]; then
              echo "::error::live catalog still differs from the committed public projection after $attempt attempts"
              cmp /tmp/live-catalog.json candidate-catalog.json || true
              cmp /tmp/live-catalog.sig.json candidate-catalog.signature.json || true
              exit 1
            fi
            echo "live catalog not yet consistent (attempt $attempt); retrying in 10s"
            sleep 10
          done
          if grep -q '"public": false' /tmp/live-catalog.json; then
            echo "::error::live catalog exposes public:false entries"; exit 1
          fi
          echo "live catalog.openasr.org matches the committed public projection (public-only)"
