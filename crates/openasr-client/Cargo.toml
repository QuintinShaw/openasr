[package]
name = "openasr-client"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "OpenASR remote compute client: TOFU TLS fingerprint pinning, LAN pairing, pinned HTTPS transcription, and pinned WSS realtime."

[dependencies]
futures-util.workspace = true
openasr-core.workspace = true
# Mirror the desktop client's exact rustls config (ring-only, no aws-lc-rs) so
# feature unification keeps the client dependency graph lean. Do NOT inherit the
# workspace rustls (its default features pull aws-lc-rs).
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tokio-tungstenite.workspace = true

[dev-dependencies]
openasr-server = { workspace = true, features = ["test-support"] }
rcgen.workspace = true
tempfile.workspace = true
