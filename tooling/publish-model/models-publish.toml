# FireRedASR2-LLM: imported via the public `openasr model-pack import
# firered-llm` subcommand (import_firered_llm_local_command in
# model_pack_cli.rs), from three inputs: the conformer encoder + adapter
# safetensors (pt_to_safetensors.py over asr_encoder.pth.tar) with cmvn.txt
# (firered_llm_cmvn_ark_to_txt.py over cmvn.ark) in the staged source dir,
# the LoRA-merged Qwen2-7B-Instruct safetensors (firered_llm_merge_lora.py
# merging model.pth.tar's PEFT adapters into the nested Qwen2-7B-Instruct
# base weights the same repo ships), and the Qwen2 metadata dir. Like the
# firered-aed/dolphin importers it bakes license metadata from models-core
# rather than taking CLI license flags (needs_license_flags = false).
# source_revision left at the branch tip: upstream FireRedASR2-LLM publishes
# no pinned release tag, mirroring how qwen3-forced-aligner tracks "main".
["firered2-llm"]
import_subcommand = "import firered-llm"
upstream_repo = "FireRedTeam/FireRedASR2-LLM"
source_revision = "main"
needs_license_flags = false
# The nested Qwen2-7B-Instruct base weights (sharded) plus its tokenizer
# triplet are consumed by firered_llm_merge_lora.py and the importer's
# tokenizer bake; list them so a partial base download fails here, not
# mid-merge.
required_download_files = [
    "asr_encoder.pth.tar", "model.pth.tar", "cmvn.ark",
    "Qwen2-7B-Instruct/config.json", "Qwen2-7B-Instruct/model.safetensors.index.json",
    "Qwen2-7B-Instruct/model*.safetensors",
    "Qwen2-7B-Instruct/vocab.json", "Qwen2-7B-Instruct/merges.txt",
    "Qwen2-7B-Instruct/tokenizer_config.json",
]
prep_scripts = [
    "python3 tooling/publish-model/scripts/pt_to_safetensors.py --pt {src}/asr_encoder.pth.tar --out {src}/model.safetensors",
    "python3 tooling/publish-model/scripts/firered_llm_cmvn_ark_to_txt.py --ark {src}/cmvn.ark --out {src}/cmvn.txt",
    "python3 tooling/publish-model/scripts/pt_to_safetensors.py --pt {src}/model.pth.tar --out {work}/firered2_lora.safetensors",
    "python3 tooling/publish-model/scripts/firered_llm_merge_lora.py --lora-safetensors {work}/firered2_lora.safetensors --qwen2-dir {src}/Qwen2-7B-Instruct --out {work}/qwen2_merged.safetensors",
]
required_source_files = ["model.safetensors", "cmvn.txt"]
import_command = "model-pack import firered-llm {src} {work}/qwen2_merged.safetensors {src}/Qwen2-7B-Instruct {out} --package-id {registry_id} --quantization {quant}"

