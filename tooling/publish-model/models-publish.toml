    "python3 tooling/publish-model/scripts/pt_to_safetensors.py --pt {src}/base.cn.pt --out {src}/full.safetensors",
]
required_source_files = ["full.safetensors", "units.txt"]
import_command = "model-pack import dolphin {src} {out} --package-id {registry_id} --quantization {quant} --language-scheme cn-dialect"

# Dolphin multilingual (small/base) -> .oasr converter: same "import dolphin"
# subcommand, but the source ships a SentencePiece bpe.model + config.yaml
# instead of the cn-dialect family's raw units.txt-only char vocab (the
# importer's units.txt is still the id-ordered token list either way; only the
# detokenize join differs at runtime, keyed off the pack's own
# `dolphin.tokenizer.model` metadata). The global_cmvn tensors are NOT baked
# into these checkpoints: dolphin_fold_espnet_cmvn.py derives them from the
# ESPnet feats_stats.npz accumulators and appends them to full.safetensors.
# Scheme is per-code <lang>+<region> multilingual (NOT the cn-dialect default
# the CLI once silently applied -- the bug that built dolphin-small with the
# wrong decode prefix).
["dolphin-small"]
import_subcommand = "import dolphin"
upstream_repo = "DataoceanAI/dolphin-small"
source_revision = "main"
needs_license_flags = false
required_download_files = ["small.pt", "units.txt", "bpe.model", "config.yaml", "feats_stats.npz"]
prep_scripts = [
    "python3 tooling/publish-model/scripts/pt_to_safetensors.py --pt {src}/small.pt --out {src}/full.safetensors",
    "python3 tooling/publish-model/scripts/dolphin_fold_espnet_cmvn.py --safetensors {src}/full.safetensors --feats-stats {src}/feats_stats.npz",
]
required_source_files = ["full.safetensors", "units.txt", "bpe.model"]
import_command = "model-pack import dolphin {src} {out} --package-id {registry_id} --quantization {quant} --language-scheme multilingual"

["dolphin-base"]
