# Qwen3-ForcedAligner-0.6B: shares its thinker (audio encoder + LM) tensor
# layout byte-for-byte with qwen3-asr (see
# crates/openasr-core/src/models/qwen/forced_aligner_import.rs); only the
# final head differs (independent classify_num=5000 timestamp-bin head vs
# tied lm_head). Imported via the public `openasr model-pack import
# qwen-forced-aligner` subcommand (same request shape as qwen). The CLI
# defaults for source-name/license-name are stated explicitly anyway: the
# pipeline never relies on argument defaults.
# Forced-aligner imports intentionally expose only fp16 and q8_0. Publishing
# builds both supported tiers; models-core.toml keeps q8_0 recommended.
["qwen3-forced-aligner-0.6b"]
import_subcommand = "import qwen-forced-aligner"
upstream_repo = "Qwen/Qwen3-ForcedAligner-0.6B"
source_revision = "c7cbfc2048c462b0d63a45797104fc9db3ad62b7"
