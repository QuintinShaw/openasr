# Dolphin WeNet -> .oasr converter. The importer takes a local
# full.safetensors + units.txt and emits fp16/q8_0/q4_k packs; it does not accept
# license flags (needs_license_flags = false, like xasr-zipformer).
#
# The cn-dialect checkpoints bake global_cmvn into the state dict, so
# pt_to_safetensors.py alone produces an import-ready full.safetensors. The
# decode-prefix scheme is the fixed-<zh> cn-dialect builder: the CLI's
# --language-scheme is REQUIRED (no default), so the recipe states it.
["dolphin-cn-dialect-small"]
import_subcommand = "import dolphin"
upstream_repo = "DataoceanAI1/dolphi-cn-dialect-small"
source_revision = "main"
needs_license_flags = false
required_download_files = ["small.cn.pt", "units.txt"]
prep_scripts = [
    "python3 tooling/publish-model/scripts/pt_to_safetensors.py --pt {src}/small.cn.pt --out {src}/full.safetensors",
]
required_source_files = ["full.safetensors", "units.txt"]
import_command = "model-pack import dolphin {src} {out} --package-id {registry_id} --quantization {quant} --language-scheme cn-dialect"

["dolphin-cn-dialect-base"]
