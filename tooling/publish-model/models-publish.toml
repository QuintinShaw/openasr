# OpenASR publish-only model pipeline data.
#
# These fields drive the internal build/publish lane and are intentionally kept
# separate from consumer-facing registry/catalog fields in models-core.toml.
#
# Pipeline fields consumed by download.sh / prep.sh / convert.sh (all optional;
# absence means the generic path):
#
#   download_includes        fetch ONLY these patterns from upstream_repo
#                            (repos shipping redundant weight formats --
#                            whisper-large-v3 ships the same model 4x over).
#   download_excludes        extra patterns on top of the harness defaults.
#   extra_sources            "repo@rev:subdir" lines: auxiliary upstream repos
#                            staged under the model's src dir.
#   required_download_files  globs that must exist right after the download.
#   prep_scripts             ordered command templates run by prep.sh between
#                            download and convert; placeholders {src} {work}
#                            {model} {packs_dir} {registry_id} {quant}.
#   required_source_files    globs that must exist before import (after prep).
#   import_command           full `model-pack ...` invocation template for
#                            families whose CLI shape differs from the generic
#                            `import <subcommand> <src> <out>` default.
#   external_converter       command template for families converted outside
#                            `openasr model-pack import` entirely; must produce
#                            the pack at {out}.
#   requant_source_quant     optional internal source quant for external
#                            converters that cannot emit a target tier (used
#                            when the target is q4_k); the converter writes a
#                            temporary source pack under {work}, then the
#                            pipeline runs the shared Rust `model-pack requant`
#                            seam into {out}.
#
# The required_* gates are fail-closed by design: an upstream that changes its
# file layout, an exclude rule that strips the only checkpoint, or a tokenless
# fetch of a private repo that lands a 29-byte error page all fail HERE with
# the gap named, instead of masquerading as a successful stage.

["qwen3-asr-1.7b"]
import_subcommand = "import qwen"
upstream_repo = "Qwen/Qwen3-ASR-1.7B"
source_revision = "main"
needs_license_flags = true
required_source_files = ["config.json", "tokenizer_config.json", "model.safetensors.index.json", "model-*.safetensors"]

