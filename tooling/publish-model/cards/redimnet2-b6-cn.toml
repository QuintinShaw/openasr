# Per-model card prose for OpenASR/redimnet2-b6-cn. Distilled from the
# PalabraAI/redimnet2 model card and OpenASR packaging notes.

pipeline_tag = "feature-extraction"

tagline = "ReDimNet2-B6 — the shared 192-d speaker embedding and Voice ID space for every OpenASR model"

highlights = [
  "🗣️ **One Voice ID space for every ASR model** — clusters external speaker turns and matches enrolled people; MOSS keeps its native turns but uses the same identity stage",
  "🧬 **192-dim ReDimNet2-B6** — PalabraAI's dimension-reshaping speaker net (12.5M params) with a Chinese-enhanced vb2+vox2+cnc2 training mix",
  "🔒 **Local and explicit identity** — unknown voices keep anonymous session-relative labels; only explicitly enrolled profiles persist for future local file transcriptions",
  "🎯 **Parity-gated packaging** — ggml-graph forward pass matches the upstream Python reference at cosine ≥ 0.9999 on held-out fixtures",
  "🦀 **Native in OpenASR** — `.oasr` packs run with no Python at inference and share the same pull/install path as ASR models",
]

intro = """
ReDimNet2-B6 is PalabraAI's 12.5M-parameter speaker-embedding model from the
ReDimNet2 family, trained on a VoxBlink2 + VoxCeleb2 + CN-Celeb2 mix so English and
Chinese speakers share one embedding space. OpenASR packages the MIT-licensed
checkpoint as a local fp16 `.oasr` capability pack and runs it through a ggml
graph (not a pure-Rust hand-written forward). It is the only supported speaker
embedding and identity space: the shared external diarizer uses it for clustering,
and every Voice ID route -- including MOSS's native speaker turns -- uses it for
evidence and enrolled-person matching. Missing or broken packs fail closed rather
than changing embedding spaces or fabricating an identity. Embeddings are 192-d
cosine vectors with a ReDimNet-specific calibration profile.
"""

acknowledgement = """
This pack redistributes **PalabraAI/redimnet2** checkpoint
`b6-vb2+vox2+cnc2_v0-lm.pt` in OpenASR's `.oasr` runtime format. Credit for the
model architecture, training, and original weights belongs to the upstream
PalabraAI / ReDimNet2 authors (paper: ReDimNet2: Scaling Speaker Verification via
Time-Pooled Dimension Reshaping). The upstream model is licensed under **MIT**;
OpenASR packaging retains that license and attribution, with the only modification
being format conversion for local ggml-graph loading.
"""

