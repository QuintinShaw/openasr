# Per-model card prose for openasr/qwen3-forced-aligner-0.6b. Distilled
# (paraphrased, not copied) from the upstream Qwen/Qwen3-ForcedAligner-0.6B
# model card. Claims are kept to what the upstream repo and architecture
# state; re-verify against the upstream card when the upstream weights
# change.
#
# Public release source for the Q4_K, Q8_0, and FP16 capability packs. The generated
# catalog is still guarded by the anonymous HF listing and artifact-integrity
# checks.

tagline = "Word-level forced alignment for OpenASR transcripts -- a non-autoregressive Qwen3 audio+text model that refines per-word timestamps"
tagline_zh = "为 OpenASR 转写结果提供词级强制对齐 — 非自回归的 Qwen3 音频+文本模型，用于精修逐词时间戳"

highlights = [
  "🎯 **Refined word timestamps** — consumes a finished transcript's text plus the source audio and replaces a model family's own approximate per-word timestamps with aligner-refined spans (`--word-timestamps=aligned`)",
  "⚡ **Non-autoregressive** — a single forward pass over interleaved audio/text with argmax at `<timestamp>` positions (5000 80ms-wide bins), not incremental greedy decoding, so it is not dispatched through the qwen3-asr runtime",
  "🧩 **Shares its backbone with Qwen3-ASR** — the same audio-encoder + LM `thinker` tensor layout, byte-for-byte; only the final head differs (an independent 5000-way classification head instead of the tied vocabulary head)",
  "🔌 **Shared attribution dependency** — used explicitly by `--word-timestamps=aligned` and internally when external diarization must split a coarse ASR segment at speaker changes",
  "🦀 **Validated native Q4_K default** — the public q4_k name follows OpenASR's unified tier naming, while boundary-sensitive audio, token-embedding, and timestamp-head matrices stay Q8_0; Q8_0 and FP16 remain available",
]

highlights_zh = [
  "🎯 **精修词级时间戳** — 输入已完成的转写文本与原始音频，用对齐模型精修后的时间跨度替换模型自身的近似逐词时间戳（`--word-timestamps=aligned`）",
  "⚡ **非自回归** — 对交错的音频/文本做单次前向计算，在 `<timestamp>` 位置取 argmax（5000 个 80ms 宽的分箱），不是逐步贪心解码，因此不通过 qwen3-asr 运行时派发",
  "🧩 **与 Qwen3-ASR 共享骨干** — 音频编码器 + LM 的 `thinker` 张量布局逐位相同，仅末端输出头不同（独立的 5000 分类头，而非共享词表的绑定头）",
  "🔌 **统一归属依赖** — 既支持显式 `--word-timestamps=aligned`，也会在外置说话人分离需要把粗粒度 ASR 段切到换人边界时由内部调用",
  "🦀 **经验证的原生 Q4_K 默认档** — q4_k 沿用 OpenASR 统一档位命名，但对边界敏感的音频、词嵌入和时间戳输出头仍保持 Q8_0；另提供 Q8_0 与 FP16",
]

intro = """
Qwen3-ForcedAligner-0.6B is a **word-level forced-alignment** model from **Qwen**, sharing its
audio-encoder + LM `thinker` tensor layout byte-for-byte with **Qwen3-ASR** (same
`Qwen3ASRForConditionalGeneration` architecture). The only structural difference is the final
head: instead of a tied vocabulary `lm_head`, it uses an independent `Linear(hidden_size,
5000)` classification head over 80ms-wide timestamp bins. Given a transcript's text and its
source audio, it runs a single non-autoregressive forward pass and reads off word-boundary
timestamps at argmax `<timestamp>` positions -- refining a model family's own (typically
decode-time-approximate) per-word timestamps. This OpenASR repo repackages the weights as
`.oasr` packs that run natively in the OpenASR runtime -- no Python at inference, all decoding
local. OpenASR recommends the validated **q4_k** tier and also ships **q8_0** and an **fp16**
full-precision reference tier. The q4_k label is the catalog's unified product name, not a claim
that every matrix uses Q4_K: the audio encoder, token embedding, and timestamp head remain Q8_0,
and pack verification replays the exact per-tensor policy. Q3 and legacy all-Q4 packs are rejected
because small logit perturbations can move a word boundary across multiple 80ms bins.

**Not a standalone transcription model.** This pack cannot transcribe audio by itself; it is an
alignment dependency consumed explicitly via `openasr transcribe <audio> --model <asr-model>
--word-timestamps=aligned`. It is also invoked internally when external speaker diarization
must split a coarse ASR segment at speaker changes; internally requested word anchors are
removed again unless the caller asked to receive them.

**Verification:** local verification covers a tensor-parity check against the real upstream
checkpoint -- every source safetensors tensor maps 1:1 to a destination tensor, plus the two
synthesized frontend tensors. On the fixed 205-item Chinese alignment set, the recommended q4_k
pack's CPU and Apple M1 Metal outputs each stayed within 320ms of the official reference and within
one 80ms model bin of q8_0. All published tiers pass their declared per-tensor quantization policy.
"""

intro_zh = """
Qwen3-ForcedAligner-0.6B 是 **Qwen** 推出的**词级强制对齐**模型，其音频编码器 + LM 的
`thinker` 张量布局与 **Qwen3-ASR** 逐位相同（同一 `Qwen3ASRForConditionalGeneration`
架构）。唯一的结构差异在末端输出头：不使用绑定词表的 `lm_head`，而是在 80ms 宽的时间戳分箱上
使用独立的 `Linear(hidden_size, 5000)` 分类头。给定转写文本及其对应的原始音频，模型执行一次
非自回归前向计算，在 `<timestamp>` 位置的 argmax 处读出词边界时间戳——用于精修某个模型家族自身
（通常是解码时的近似值）的逐词时间戳。

这个仓库提供 OpenASR `.oasr` 格式包。OpenASR 会在本地完成加载、校验和推理，不会把音频上传到
云端。推荐使用经过真实中文会议音频验证的 `q4_k` 档，并提供 `q8_0` 与 `fp16`。这里的
`q4_k` 沿用 catalog 的统一档位名，不表示所有矩阵都是 Q4_K：音频编码器、词嵌入和时间戳输出头
仍保持 Q8_0，验包时会逐张量重放这套精度策略。Q3 与旧的全 Q4 包会被拒绝，因为细小的输出扰动
也可能让词边界跨越多个 80ms 时间分箱。

**不是独立的转写模型。** 本模型包本身无法转写音频；它是通过
`openasr transcribe <audio> --model <asr-model> --word-timestamps=aligned` 显式调用；当外置说话人
分离需要把粗粒度 ASR 段准确切到换人边界时，也会由内部自动调用。若调用方未请求逐词时间戳，
内部生成的词锚点会在说话人归属完成后移除。

**验证情况:** 本地验证已覆盖对照真实上游检查点的张量对齐检查——每个源 safetensors 张量均一一
映射至目标张量，外加两个合成前端张量。在固定的 205 项中文对齐集上，推荐的 q4_k 包在 CPU 与
Apple M1 Metal 上相对官方参考的最大边界偏差均为 320ms，相对 q8_0 的最大差异为一个 80ms 时间格；
三个发布档均通过各自声明的逐张量精度策略校验。
"""

