tagline = "Word-level forced alignment for OpenASR transcripts -- a non-autoregressive Qwen3 audio+text model that refines per-word timestamps"
tagline_zh = "为 OpenASR 转写结果提供词级强制对齐 — 非自回归的 Qwen3 音频+文本模型，用于精修逐词时间戳"

highlights = [
  "🎯 **Refined word timestamps** — consumes a finished transcript's text plus the source audio and replaces a model family's own approximate per-word timestamps with aligner-refined spans (`--word-timestamps=aligned`)",
  "⚡ **Non-autoregressive** — a single forward pass over interleaved audio/text with argmax at `<timestamp>` positions (5000 80ms-wide bins), not incremental greedy decoding, so it is not dispatched through the qwen3-asr runtime",
  "🧩 **Shares its backbone with Qwen3-ASR** — the same audio-encoder + LM `thinker` tensor layout, byte-for-byte; only the final head differs (an independent 5000-way classification head instead of the tied vocabulary head)",
  "🔌 **Shared attribution dependency** — used explicitly by `--word-timestamps=aligned` and internally when external diarization must split a coarse ASR segment at speaker changes",
  "🦀 **Native Q8_0 + FP16 runtimes** — Q8_0 is recommended for production, while FP16 remains available as the full-precision reference tier; both run locally with no Python",
]

highlights_zh = [
  "🎯 **精修词级时间戳** — 输入已完成的转写文本与原始音频，用对齐模型精修后的时间跨度替换模型自身的近似逐词时间戳（`--word-timestamps=aligned`）",
  "⚡ **非自回归** — 对交错的音频/文本做单次前向计算，在 `<timestamp>` 位置取 argmax（5000 个 80ms 宽的分箱），不是逐步贪心解码，因此不通过 qwen3-asr 运行时派发",
  "🧩 **与 Qwen3-ASR 共享骨干** — 音频编码器 + LM 的 `thinker` 张量布局逐位相同，仅末端输出头不同（独立的 5000 分类头，而非共享词表的绑定头）",
