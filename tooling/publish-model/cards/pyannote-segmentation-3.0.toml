# Per-model card prose for OpenASR/pyannote-segmentation-3.0. Distilled
# (paraphrased, not copied) from the pyannote segmentation-3.0 model card.

pipeline_tag = "voice-activity-detection"

tagline = "pyannote segmentation-3.0 — OpenASR's default permissive speaker-change and overlap segmenter"

highlights = [
  "✂️ **Speaker-change aware segmentation** — PyanNet (SincNet + BiLSTM) tracks 3 local speaker slots and scores at most 2 as active at once, including overlapped speech",
  "🤝 **Default external Voice ID segmenter** — combines with FireRed Stream-VAD, ReDimNet2-B6 and automatic clustering for ASR models without native speaker turns",
  "🔒 **Diarization, not identification** — anonymous session-relative labels; nothing leaves the machine",
  "🎯 **Bit-exact packaging** — single raw-f32 build; the pure-Rust forward pass matches the upstream ONNX logits (max abs error ~7e-5)",
  "🦀 **Native in OpenASR** — the raw-f32 `.oasr` pack runs through the pure-Rust CPU inference path with no Python at runtime",
]

intro = """
pyannote **segmentation-3.0** is the local speech-segmentation model from the pyannote speaker
diarization toolkit: a PyanNet (SincNet front-end + bidirectional LSTM) classifier over a 7-class
powerset that tracks three local speaker slots in each 10 s window, with no more than two active
simultaneously -- including overlapped speech. OpenASR uses it as the default permissive segmenter in the
model-independent file Voice ID pipeline for ASR families without native speaker
turns. Its local activity is combined with FireRed Stream-VAD; ReDimNet2-B6 then
embeds speech windows for automatic clustering and overlap-aware reconstruction.
Weights are extracted from the un-gated, MIT-licensed
**onnx-community** ONNX mirror at a pinned revision and repackaged as a raw-f32 `.oasr` pack that
runs in pure Rust — no Python at inference time.
"""

acknowledgement = """
This pack is a redistribution of **pyannote segmentation-3.0**, created by Hervé Bredin and the
**pyannote.audio** project, via the un-gated ONNX mirror
([onnx-community/pyannote-segmentation-3.0](https://huggingface.co/onnx-community/pyannote-segmentation-3.0)).
All credit for the architecture, training, and weights belongs to the upstream authors; the license
is inherited from and identical to the upstream model (MIT).
"""

