# Per-model card prose for OpenASR/wespeaker-voxceleb-resnet221-lm.
# Distilled from Wespeaker/wespeaker-voxceleb-resnet221-LM and the WeSpeaker paper.

pipeline_tag = "feature-extraction"

tagline = "WeSpeaker ResNet221 — high-capacity 256-d VoxCeleb English speaker embeddings"

highlights = [
  "🎙️ **Optional Voice ID space** — 256-d WeSpeaker ResNet, loaded only when you set `voice_id_embedder=wespeaker`; ReDimNet2-B6 stays the default",
  "🧬 **ResNet221-TSTP-emb256** — 23.79M-param Bottleneck r-vector with large-margin finetune on VoxCeleb2 Dev",
  "📏 **Same family, four sizes** — 34/152/221/293 share one ggml graph; this sits between 152 and 293",
  "🎯 **Parity-gated packaging** — ggml-graph forward matches official PyTorch at cosine ≥ 0.999 on held-out fixtures (CPU and Metal)",
]

intro = """
WeSpeaker ResNet221 is a 23.79M-parameter Bottleneck r-vector from Wenet's
VoxCeleb English LM family: temporal statistics pooling to a 256-d embedding,
large-margin finetuned on VoxCeleb2 Dev. OpenASR packages the CC BY 4.0
checkpoint as a local fp16 `.oasr` capability pack and runs it through the same
parameterized ggml graph as ResNet34/152/293. It is an explicit optional
speaker-embedding space beside the default ReDimNet2-B6 pack — there is no Auto
fallback, and enrollments do not transfer across the two spaces. Languages are
English-only (`en`). Pick this size when you want the deeper WeSpeaker net
without ResNet293's extra depth.
"""

acknowledgement = """
This pack redistributes **Wespeaker/wespeaker-voxceleb-resnet221-LM**
(`voxceleb_resnet221_LM.pt`) in OpenASR's `.oasr` runtime format. Credit for the
architecture, training, and original weights belongs to the WeSpeaker authors
(Wenet; paper: Wespeaker: A research and production oriented speaker embedding
learning toolkit, ICASSP 2023, https://arxiv.org/abs/2210.17016). The upstream
model is licensed under **CC BY 4.0**; OpenASR packaging retains that license
and attribution, with the only modification being format conversion for local
ggml-graph loading.
"""

